name: Validate API

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify generated catalog metadata
        run: node scripts/sync-catalog.mjs --check
      - name: Verify generated SEO pages and sitemap
        run: node scripts/generate-seo-pages.mjs --check
      - name: Validate SEO metadata and crawlable content
        run: node scripts/validate-seo.mjs
      - name: Verify compact global search index
        run: node scripts/generate-search-index.mjs --check
      - name: Audit exact and semantic question duplicates
        run: node scripts/audit-question-bank.mjs --strict
      - name: Validate static source, taxonomy, and generated card index
        run: node scripts/validate-static.mjs
      - name: Validate complete English and Arabic coverage
        run: node scripts/validate-bilingual.mjs
      - name: Test production monitor
        run: node --test scripts/monitor-production.test.mjs
      - name: Install API dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Audit API deployment dependencies
        working-directory: worker
        run: npm run audit:security
      - name: Type-check API
        working-directory: worker
        run: npm run check
      - name: Test API
        working-directory: worker
        run: npm test
      - name: Validate deploy bundle
        working-directory: worker
        env:
          PASSWORD_PEPPER: ci-only-placeholder-password-pepper
          IP_HASH_SALT: ci-only-placeholder-ip-hash-salt
        run: npx wrangler deploy --dry-run --outdir /tmp/jakh-api-dry-run

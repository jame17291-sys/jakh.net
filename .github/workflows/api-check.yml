name: Validate API

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate static source and generated card index
        run: node scripts/validate-static.mjs
      - name: Install API dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Type-check API
        working-directory: worker
        run: npm run check
      - name: Test API
        working-directory: worker
        run: npm test
      - name: Validate deploy bundle
        working-directory: worker
        env:
          PASSWORD_PEPPER: ci-only-placeholder-password-pepper
          IP_HASH_SALT: ci-only-placeholder-ip-hash-salt
        run: npx wrangler deploy --dry-run --outdir /tmp/jakh-api-dry-run

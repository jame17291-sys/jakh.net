name: Deploy API
run-name: API ${{ inputs.release_phase }} · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      release_phase:
        description: >-
          Compatibility deploys schema-tolerant code without touching D1. Migrate-final is a
          separate run that requires the active compatibility Worker before applying migrations.
        required: true
        default: compatibility
        type: choice
        options:
          - compatibility
          - migrate-final

permissions:
  contents: read

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  production-branch:
    name: Confirm production branch
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [ "$DEPLOY_REF" != "refs/heads/main" ]; then
            echo "::error title=Production deployment blocked::Deploy the API only from main. Merge the branch first, then re-run this workflow from main."
            exit 1
          fi

  validate:
    name: Validate release source and API
    needs: production-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate release source
        run: |
          node scripts/api-release-receipt.mjs validate-source
          node --test scripts/api-release-receipt.test.mjs
          node scripts/sync-catalog.mjs --check
          node scripts/generate-seo-pages.mjs --check
          node scripts/generate-arabic-routes.mjs --check
          node scripts/generate-search-index.mjs --check
          node scripts/content-review-report.mjs --check
          node scripts/audit-question-bank.mjs --strict
          node scripts/validate-seo.mjs
          node scripts/validate-static.mjs
          node scripts/validate-bilingual.mjs
          node scripts/validate-responsive-images.mjs
          node scripts/validate-game-focus.mjs
          node --test \
            scripts/accessibility-contracts.test.mjs \
            scripts/arabic-routes.test.mjs \
            scripts/content-review.test.mjs \
            scripts/frontend-product-contract.test.mjs \
            scripts/provenance-ui-contract.test.mjs \
            scripts/responsive-layout-contract.test.mjs \
            scripts/seo-pagination.test.mjs \
            scripts/seo-validation-contract.test.mjs \
            scripts/service-worker-contract.test.mjs
          node --test scripts/monitor-production.test.mjs scripts/route-production-alert.test.mjs
      - name: Validate API
        working-directory: worker
        env:
          PASSWORD_PEPPER: ci-only-placeholder-password-pepper
          IP_HASH_SALT: ci-only-placeholder-ip-hash-salt
        run: |
          npm ci --no-audit --no-fund
          npm run audit:security
          npm run check
          npm run test:coverage
          npm run test:integration
          npx wrangler deploy --dry-run --outdir /tmp/jakh-api-dry-run

  compatibility:
    name: Deploy compatibility Worker without D1 mutation
    needs: validate
    if: ${{ inputs.release_phase == 'compatibility' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install pinned Worker tooling
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Capture compatibility preflight without mutating D1
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECEIPT_DIR: ${{ runner.temp }}/jakh-api-release
          WRANGLER_LOG_PATH: ${{ runner.temp }}/jakh-api-wrangler.log
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIR"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            https://api.jakh.net/api/health > "$RECEIPT_DIR/health-before.json"
          (
            cd worker
            ./node_modules/.bin/wrangler deployments status --json \
              > "$RECEIPT_DIR/worker-before.json"
            ./node_modules/.bin/wrangler d1 execute DB --remote --json \
              --command "SELECT value FROM schema_meta WHERE key = 'schema_version'" \
              > "$RECEIPT_DIR/database-before.json"
            ./node_modules/.bin/wrangler d1 migrations list DB --remote \
              > "$RECEIPT_DIR/migrations-before.txt"
          )
          node scripts/api-release-receipt.mjs preflight \
            --phase compatibility \
            --deployment "$RECEIPT_DIR/worker-before.json" \
            --health "$RECEIPT_DIR/health-before.json" \
            --database "$RECEIPT_DIR/database-before.json" \
            --migrations "$RECEIPT_DIR/migrations-before.txt" \
            --receipt "$RECEIPT_DIR/release-receipt.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Deploy compatibility Worker
        id: deploy_compatibility
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.116.0"
          command: deploy --strict --message "JAKH compatibility ${{ github.sha }} target schema ${{ steps.preflight.outputs.target-schema }} run ${{ github.run_id }}"
      - name: Verify compatibility Worker and unchanged D1
        id: verify_production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECEIPT_DIR: ${{ runner.temp }}/jakh-api-release
          WRANGLER_LOG_PATH: ${{ runner.temp }}/jakh-api-wrangler.log
        run: |
          set -u
          health_status=000
          for attempt in 1 2 3 4 5 6; do
            if health_status="$(curl --silent --show-error \
              --output "$RECEIPT_DIR/health-after-compatibility.json" \
              --write-out '%{http_code}' https://api.jakh.net/api/health)" \
              && node scripts/api-release-receipt.mjs probe \
                --stage compatibility \
                --health "$RECEIPT_DIR/health-after-compatibility.json" \
                --http-status "$health_status" \
                --receipt "$RECEIPT_DIR/release-receipt.json"; then
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "$health_status" > "$RECEIPT_DIR/health-after-compatibility.http"
          (
            set -e
            cd worker
            ./node_modules/.bin/wrangler deployments status --json \
              > "$RECEIPT_DIR/worker-after-compatibility.json"
            ./node_modules/.bin/wrangler d1 execute DB --remote --json \
              --command "SELECT value FROM schema_meta WHERE key = 'schema_version'" \
              > "$RECEIPT_DIR/database-after-compatibility.json"
            ./node_modules/.bin/wrangler d1 migrations list DB --remote \
              > "$RECEIPT_DIR/migrations-after-compatibility.txt"
          )
          node scripts/api-release-receipt.mjs post-compatibility \
            --deployment "$RECEIPT_DIR/worker-after-compatibility.json" \
            --health "$RECEIPT_DIR/health-after-compatibility.json" \
            --http-status "$health_status" \
            --database "$RECEIPT_DIR/database-after-compatibility.json" \
            --migrations "$RECEIPT_DIR/migrations-after-compatibility.txt" \
            --receipt "$RECEIPT_DIR/release-receipt.json"
      - name: Roll back failed compatibility deployment
        id: rollback_worker
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.deploy_compatibility.outcome != 'skipped' && steps.verify_production.outcome != 'success' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.116.0"
          command: >-
            rollback ${{ steps.preflight.outputs.rollback-version }}
            --message "Automatic compatibility rollback after GitHub Actions run ${{ github.run_id }}"
      - name: Verify exact compatibility rollback
        id: verify_rollback
        if: ${{ always() && steps.rollback_worker.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECEIPT_DIR: ${{ runner.temp }}/jakh-api-release
          WRANGLER_LOG_PATH: ${{ runner.temp }}/jakh-api-wrangler.log
        run: |
          set -u
          health_status=000
          for attempt in 1 2 3 4 5 6; do
            if health_status="$(curl --silent --show-error \
              --output "$RECEIPT_DIR/health-after-rollback.json" \
              --write-out '%{http_code}' https://api.jakh.net/api/health)" \
              && node scripts/api-release-receipt.mjs probe \
                --stage rollback \
                --health "$RECEIPT_DIR/health-after-rollback.json" \
                --http-status "$health_status" \
                --receipt "$RECEIPT_DIR/release-receipt.json"; then
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          (
            set -e
            cd worker
            ./node_modules/.bin/wrangler deployments status --json > "$RECEIPT_DIR/worker-after-rollback.json"
            ./node_modules/.bin/wrangler d1 execute DB --remote --json \
              --command "SELECT value FROM schema_meta WHERE key = 'schema_version'" \
              > "$RECEIPT_DIR/database-after-rollback.json"
            ./node_modules/.bin/wrangler d1 migrations list DB --remote > "$RECEIPT_DIR/migrations-after-rollback.txt"
          )
          node scripts/api-release-receipt.mjs post-rollback \
            --deployment "$RECEIPT_DIR/worker-after-rollback.json" \
            --health "$RECEIPT_DIR/health-after-rollback.json" \
            --http-status "$health_status" \
            --database "$RECEIPT_DIR/database-after-rollback.json" \
            --migrations "$RECEIPT_DIR/migrations-after-rollback.txt" \
            --receipt "$RECEIPT_DIR/release-receipt.json"
      - name: Finalize compatibility receipt
        if: ${{ always() }}
        continue-on-error: true
        env:
          RECEIPT_DIR: ${{ runner.temp }}/jakh-api-release
        run: |
          if [ -f "$RECEIPT_DIR/release-receipt.json" ]; then
            node scripts/api-release-receipt.mjs finalize \
              --receipt "$RECEIPT_DIR/release-receipt.json" \
              --preflight-outcome "${{ steps.preflight.outcome }}" \
              --compatibility-deploy-outcome "${{ steps.deploy_compatibility.outcome }}" \
              --migrations-outcome skipped \
              --migration-compatibility-outcome skipped \
              --final-deploy-outcome skipped \
              --production-verification-outcome "${{ steps.verify_production.outcome }}" \
              --worker-rollback-outcome "${{ steps.rollback_worker.outcome }}" \
              --rollback-verification-outcome "${{ steps.verify_rollback.outcome }}"
            node scripts/api-release-receipt.mjs summary \
              --receipt "$RECEIPT_DIR/release-receipt.json" \
              --github-summary "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload compatibility receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jakh-api-release
          if-no-files-found: warn
          retention-days: 90

  migrate-final:
    name: Migrate D1 and finalize proven-compatible Worker
    needs: validate
    if: ${{ inputs.release_phase == 'migrate-final' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install pinned Worker tooling
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Prove active Worker compatibility before D1 mutation
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECEIPT_DIR: ${{ runner.temp }}/jakh-api-release
          WRANGLER_LOG_PATH: ${{ runner.temp }}/jakh-api-wrangler.log
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIR"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            https://api.jakh.net/api/health > "$RECEIPT_DIR/health-before.json"
          (
            cd worker
            ./node_modules/.bin/wrangler deployments status --json > "$RECEIPT_DIR/worker-before.json"
            ./node_modules/.bin/wrangler d1 execute DB --remote --json \
              --command "SELECT value FROM schema_meta WHERE key = 'schema_version'" \
              > "$RECEIPT_DIR/database-before.json"
            ./node_modules/.bin/wrangler d1 migrations list DB --remote > "$RECEIPT_DIR/migrations-before.txt"
          )
          node scripts/api-release-receipt.mjs preflight \
            --phase migrate-final \
            --deployment "$RECEIPT_DIR/worker-before.json" \
            --health "$RECEIPT_DIR/health-before.json" \
            --database "$RECEIPT_DIR/database-before.json" \
            --migrations "$RECEIPT_DIR/migrations-before.txt" \
            --receipt "$RECEIPT_DIR/release-receipt.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Capture pre-migration Time Travel evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECEIPT_DIR: ${{ runner.temp }}/jakh-api-release
          WRANGLER_LOG_PATH: ${{ runner.temp }}/jakh-api-wrangler.log
        run: |
          node worker/scripts/recovery-evidence.mjs bookmark \
            --required-ref refs/heads/main \
            --lookback-hours 24 \
            --output "$RECEIPT_DIR/pre-migration-recovery-bookmark.json"
      - name: Apply database migrations
        id: apply_migrations
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.116.0"
          command: d1 migrations apply DB --remote
      - name: Verify the same compatibility Worker after migration
        id: verify_migration_compatibility
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECEIPT_DIR: ${{ runner.temp }}/jakh-api-release
          WRANGLER_LOG_PATH: ${{ runner.temp }}/jakh-api-wrangler.log
        run: |
          set -u
          health_status=000
          for attempt in 1 2 3 4 5 6; do
            if health_status="$(curl --silent --show-error \
              --output "$RECEIPT_DIR/health-after-migrations.json" \
              --write-out '%{http_code}' https://api.jakh.net/api/health)" \
              && node scripts/api-release-receipt.mjs probe \
                --stage migration \
                --health "$RECEIPT_DIR/health-after-migrations.json" \
                --http-status "$health_status" \
                --receipt "$RECEIPT_DIR/release-receipt.json"; then
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          (
            set -e
            cd worker
            ./node_modules/.bin/wrangler deployments status --json > "$RECEIPT_DIR/worker-after-migrations.json"
            ./node_modules/.bin/wrangler d1 execute DB --remote --json \
              --command "SELECT value FROM schema_meta WHERE key = 'schema_version'" \
              > "$RECEIPT_DIR/database-after-migrations.json"
            ./node_modules/.bin/wrangler d1 migrations list DB --remote > "$RECEIPT_DIR/migrations-after-migrations.txt"
          )
          node scripts/api-release-receipt.mjs post-migration \
            --deployment "$RECEIPT_DIR/worker-after-migrations.json" \
            --health "$RECEIPT_DIR/health-after-migrations.json" \
            --http-status "$health_status" \
            --database "$RECEIPT_DIR/database-after-migrations.json" \
            --migrations "$RECEIPT_DIR/migrations-after-migrations.txt" \
            --receipt "$RECEIPT_DIR/release-receipt.json"
      - name: Deploy final Worker
        id: deploy_final
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.116.0"
          command: deploy --strict --message "JAKH final ${{ github.sha }} schema ${{ steps.preflight.outputs.target-schema }} run ${{ github.run_id }}"
      - name: Verify final production health
        id: verify_production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECEIPT_DIR: ${{ runner.temp }}/jakh-api-release
          WRANGLER_LOG_PATH: ${{ runner.temp }}/jakh-api-wrangler.log
        run: |
          set -u
          health_status=000
          for attempt in 1 2 3 4 5 6; do
            if health_status="$(curl --silent --show-error \
              --output "$RECEIPT_DIR/health-after-worker.json" \
              --write-out '%{http_code}' https://api.jakh.net/api/health)" \
              && node scripts/api-release-receipt.mjs probe \
                --stage final \
                --health "$RECEIPT_DIR/health-after-worker.json" \
                --http-status "$health_status" \
                --receipt "$RECEIPT_DIR/release-receipt.json"; then
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          (
            set -e
            cd worker
            ./node_modules/.bin/wrangler deployments status --json > "$RECEIPT_DIR/worker-after-worker.json"
            ./node_modules/.bin/wrangler d1 execute DB --remote --json \
              --command "SELECT value FROM schema_meta WHERE key = 'schema_version'" \
              > "$RECEIPT_DIR/database-after-worker.json"
            ./node_modules/.bin/wrangler d1 migrations list DB --remote > "$RECEIPT_DIR/migrations-after-worker.txt"
          )
          node scripts/api-release-receipt.mjs post-deploy \
            --deployment "$RECEIPT_DIR/worker-after-worker.json" \
            --health "$RECEIPT_DIR/health-after-worker.json" \
            --http-status "$health_status" \
            --database "$RECEIPT_DIR/database-after-worker.json" \
            --migrations "$RECEIPT_DIR/migrations-after-worker.txt" \
            --receipt "$RECEIPT_DIR/release-receipt.json"
      - name: Roll back final Worker to proven compatibility version
        id: rollback_worker
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.deploy_final.outcome != 'skipped' && steps.verify_production.outcome != 'success' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.116.0"
          command: >-
            rollback ${{ steps.preflight.outputs.rollback-version }}
            --message "Automatic final rollback after GitHub Actions run ${{ github.run_id }}"
      - name: Verify exact final-phase Worker rollback
        id: verify_rollback
        if: ${{ always() && steps.rollback_worker.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECEIPT_DIR: ${{ runner.temp }}/jakh-api-release
          WRANGLER_LOG_PATH: ${{ runner.temp }}/jakh-api-wrangler.log
        run: |
          set -u
          health_status=000
          for attempt in 1 2 3 4 5 6; do
            if health_status="$(curl --silent --show-error \
              --output "$RECEIPT_DIR/health-after-rollback.json" \
              --write-out '%{http_code}' https://api.jakh.net/api/health)" \
              && node scripts/api-release-receipt.mjs probe \
                --stage rollback \
                --health "$RECEIPT_DIR/health-after-rollback.json" \
                --http-status "$health_status" \
                --receipt "$RECEIPT_DIR/release-receipt.json"; then
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          (
            set -e
            cd worker
            ./node_modules/.bin/wrangler deployments status --json > "$RECEIPT_DIR/worker-after-rollback.json"
            ./node_modules/.bin/wrangler d1 execute DB --remote --json \
              --command "SELECT value FROM schema_meta WHERE key = 'schema_version'" \
              > "$RECEIPT_DIR/database-after-rollback.json"
            ./node_modules/.bin/wrangler d1 migrations list DB --remote > "$RECEIPT_DIR/migrations-after-rollback.txt"
          )
          node scripts/api-release-receipt.mjs post-rollback \
            --deployment "$RECEIPT_DIR/worker-after-rollback.json" \
            --health "$RECEIPT_DIR/health-after-rollback.json" \
            --http-status "$health_status" \
            --database "$RECEIPT_DIR/database-after-rollback.json" \
            --migrations "$RECEIPT_DIR/migrations-after-rollback.txt" \
            --receipt "$RECEIPT_DIR/release-receipt.json"
      - name: Finalize release receipt
        if: ${{ always() }}
        continue-on-error: true
        env:
          RECEIPT_DIR: ${{ runner.temp }}/jakh-api-release
        run: |
          if [ -f "$RECEIPT_DIR/release-receipt.json" ]; then
            node scripts/api-release-receipt.mjs finalize \
              --receipt "$RECEIPT_DIR/release-receipt.json" \
              --preflight-outcome "${{ steps.preflight.outcome }}" \
              --compatibility-deploy-outcome skipped \
              --migrations-outcome "${{ steps.apply_migrations.outcome }}" \
              --migration-compatibility-outcome "${{ steps.verify_migration_compatibility.outcome }}" \
              --final-deploy-outcome "${{ steps.deploy_final.outcome }}" \
              --production-verification-outcome "${{ steps.verify_production.outcome }}" \
              --worker-rollback-outcome "${{ steps.rollback_worker.outcome }}" \
              --rollback-verification-outcome "${{ steps.verify_rollback.outcome }}"
            node scripts/api-release-receipt.mjs summary \
              --receipt "$RECEIPT_DIR/release-receipt.json" \
              --github-summary "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload final release receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jakh-api-release
          if-no-files-found: warn
          retention-days: 90

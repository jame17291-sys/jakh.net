name: Deploy API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.94.0"
          command: d1 migrations apply DB --remote
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.94.0"
          command: deploy
          secrets: |
            PASSWORD_PEPPER
            IP_HASH_SALT
        env:
          PASSWORD_PEPPER: ${{ secrets.JAKH_PASSWORD_PEPPER }}
          IP_HASH_SALT: ${{ secrets.JAKH_IP_HASH_SALT }}

name: Deploy API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate release source
        run: |
          node scripts/sync-catalog.mjs --check
          node scripts/generate-seo-pages.mjs --check
          node scripts/generate-search-index.mjs --check
          node scripts/audit-question-bank.mjs --strict
          node scripts/validate-seo.mjs
          node scripts/validate-static.mjs
          node scripts/validate-bilingual.mjs
          node --test scripts/monitor-production.test.mjs
      - name: Validate API
        working-directory: worker
        env:
          PASSWORD_PEPPER: ci-only-placeholder-password-pepper
          IP_HASH_SALT: ci-only-placeholder-ip-hash-salt
        run: |
          npm ci --no-audit --no-fund
          npm run audit:security
          npm run check
          npm test
          npx wrangler deploy --dry-run --outdir /tmp/jakh-api-dry-run
      - name: Apply database migrations
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.116.0"
          command: d1 migrations apply DB --remote
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.116.0"
          command: deploy
      - name: Verify production health
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error https://api.jakh.net/api/health \
              | grep -q '"ok":true,"service":"jakh-api","version":"1.4.0","schema":"3"'; then
              exit 0
            fi
            sleep 10
          done
          exit 1

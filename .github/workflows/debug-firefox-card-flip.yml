# TEMPORARY: reproduce the Firefox-only release-matrix failure from 24 Oct 2026
# (speech test, math-062 card). Never merge; the PR is closed after diagnosis.
name: Debug Firefox card flip
on:
  pull_request:
    paths: [".github/workflows/debug-firefox-card-flip.yml"]
permissions:
  contents: read
jobs:
  firefox:
    name: firefox ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "scroll fix 4bd4fa6b (a)", ref: "4bd4fa6b603af4b433228f7cba101ad94b48b1aa" }
          - { label: "scroll fix 4bd4fa6b (b)", ref: "4bd4fa6b603af4b433228f7cba101ad94b48b1aa" }
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ matrix.ref || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix site-worker --no-audit --no-fund
      - name: Fetch the instrumentation patch from the debug branch
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.head.sha }}
          git show ${{ github.event.pull_request.head.sha }}:.github/debug/instrument.patch > /tmp/instrument.patch
          git apply --3way /tmp/instrument.patch || git apply /tmp/instrument.patch
          grep -c "audio-click-failed" scripts/speech-browser-cases.mjs
      - name: Run only the speech test when requested
        run: |
          grep -q "JAKH_ONLY" scripts/browser-regression.mjs || sed -i 's/^async function runTest(name, callback) {$/async function runTest(name, callback) {\n  if (process.env.JAKH_ONLY \&\& !new RegExp(process.env.JAKH_ONLY).test(name)) return;/' scripts/browser-regression.mjs
          grep -n "JAKH_ONLY" scripts/browser-regression.mjs
      - name: Build
        run: npm run build:site
      - name: Install Firefox
        run: ./node_modules/.bin/playwright install --with-deps firefox
      - name: Run the speech test twenty times in Firefox
        env:
          JAKH_SITE_ROOT: ${{ github.workspace }}/site-worker/dist
          JAKH_SITE_MANIFEST: ${{ github.workspace }}/site-worker/generated/site-manifest.json
          JAKH_BROWSER_ENGINE: firefox
          JAKH_ONLY: "real Arabic question buttons"
        run: |
          pass=0
          for i in $(seq 1 20); do
            if node scripts/browser-regression.mjs > run-$i.log 2>&1; then :; fi
            if grep -q "PASS real Arabic question buttons" run-$i.log; then pass=$((pass+1)); echo "RUN $i PASS"; else echo "RUN $i FAIL"; grep "audio-click-failed" run-$i.log | cut -c1-6000; d=$(grep -m1 "audio-click-failed" run-$i.log | cut -c1-3800 | tr '\n' ' '); echo "::warning title=FAIL $i::$d"; fi
            true
          done
          echo "RESULT ${{ matrix.label }}: $pass/20 passed"
          echo "::notice title=RESULT::${{ matrix.label }}: $pass/20 passed"

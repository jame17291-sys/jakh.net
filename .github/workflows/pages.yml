name: Legacy GitHub Pages (break-glass only)
run-name: Legacy Pages retired after Riddle Arabia cutover

# This repository no longer has a GitHub Pages recovery path. Riddle Arabia is
# published only through the versioned Cloudflare Worker release workflow.
#
# Keep this manually-dispatched, failing workflow instead of deleting it so an
# accidental or bookmarked legacy Pages release has a clear, auditable denial.
# Re-enabling GitHub Pages requires a deliberate, separately reviewed change
# after confirming that it cannot claim riddlearabia.com or jakh.net.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Deny retired GitHub Pages deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block legacy Pages publication
        run: |
          set -euo pipefail
          echo "::error title=Legacy GitHub Pages retired::This workflow cannot publish a site. Deploy Riddle Arabia only with the protected Cloudflare Workers release workflow."
          echo "::error title=Domain-safety guard::Do not re-enable Pages until its custom-domain configuration cannot take over riddlearabia.com or jakh.net."
          exit 1

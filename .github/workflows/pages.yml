name: Legacy GitHub Pages (break-glass only)
run-name: Legacy Pages break-glass · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY LEGACY GITHUB PAGES"
        required: true
        type: string
      incident_reference:
        description: "Required incident/change reference explaining the break-glass release"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Shared by every workflow that can change production hosting, Workers, or D1.
  group: jakh-production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize legacy break-glass release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Require exact confirmation, incident reference, and protected main
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "DEPLOY LEGACY GITHUB PAGES" ]; then
            echo "::error title=Legacy Pages blocked::Confirmation must exactly match DEPLOY LEGACY GITHUB PAGES."
            exit 1
          fi
          if [ "$RELEASE_REF" != "refs/heads/main" ] || [ "$RELEASE_REF_PROTECTED" != "true" ]; then
            echo "::error title=Legacy Pages blocked::Break-glass deployment requires protected refs/heads/main."
            exit 1
          fi
          if [ "${#INCIDENT_REFERENCE}" -lt 8 ]; then
            echo "::error title=Legacy Pages blocked::Provide a meaningful incident or approved change reference."
            exit 1
          fi

          branch_response="$RUNNER_TEMP/main-branch.json"
          branch_status="$(curl --silent --show-error \
            --output "$branch_response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/branches/main")"
          if [ "$branch_status" != "200" ]; then
            echo "::error title=Legacy Pages blocked::Could not verify the current protected main branch (GitHub HTTP $branch_status)."
            exit 1
          fi
          node --input-type=module - "$branch_response" "$RELEASE_SHA" <<'NODE'
          import { readFileSync } from "node:fs";
          const branch = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (branch.name !== "main" || branch.protected !== true || branch.commit?.sha !== process.argv[3]) {
            throw new Error("Legacy Pages requires the current tip of protected main");
          }
          NODE

          environment_response="$RUNNER_TEMP/production-environment.json"
          environment_status="$(curl --silent --show-error \
            --output "$environment_response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/environments/production")"
          if [ "$environment_status" != "200" ]; then
            echo "::error title=Legacy Pages blocked::Could not verify the protected production environment (GitHub HTTP $environment_status)."
            exit 1
          fi
          node --input-type=module - "$environment_response" <<'NODE'
          import { readFileSync } from "node:fs";
          const environment = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const rules = Array.isArray(environment.protection_rules) ? environment.protection_rules : [];
          if (!rules.some((rule) => rule.type === "required_reviewers")) {
            throw new Error("The production environment must require an approving reviewer");
          }
          if (environment.deployment_branch_policy?.protected_branches !== true) {
            throw new Error("The production environment must allow only protected branches");
          }
          NODE

  deploy:
    name: Deploy legacy static artifact
    needs: authorize
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Bind checkout to the authorized commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error title=Legacy Pages blocked::Checkout does not match the authorized main commit."
            exit 1
          fi

      - name: Refuse a second hosting deployment
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const productionOrigins = ["https://jakh.net", "https://www.jakh.net"];
          const headers = { "cache-control": "no-cache", "user-agent": "jakh-legacy-pages-safety-gate/2.0" };
          const evidence = { schemaVersion: 1, checkedAt: new Date().toISOString(), hosts: [] };
          for (const requestedOrigin of productionOrigins) {
            const probeUrl = new URL(`/?legacy_pages_probe=${process.env.RUN_ID}`, requestedOrigin);
            const initial = await fetch(probeUrl, {
              redirect: "manual",
              headers,
              signal: AbortSignal.timeout(15000),
            });
            const initialSiteVersion = initial.headers.get("x-jakh-site-version");
            const initialWorkerVersion = initial.headers.get("x-jakh-worker-version");
            let terminal = initial;
            let terminalUrl = probeUrl;
            if ([301, 302, 307, 308].includes(initial.status)) {
              const location = initial.headers.get("location");
              if (!location) throw new Error(`${requestedOrigin} redirected without Location`);
              terminalUrl = new URL(location, probeUrl);
              if (terminalUrl.protocol !== "https:" || !["jakh.net", "www.jakh.net"].includes(terminalUrl.hostname)) {
                throw new Error(`${requestedOrigin} redirected outside the production host pair`);
              }
              terminal = await fetch(terminalUrl, {
                redirect: "manual",
                headers,
                signal: AbortSignal.timeout(15000),
              });
            }
            const record = {
              requestedOrigin,
              initialStatus: initial.status,
              initialLocation: initial.headers.get("location"),
              initialSiteVersion,
              initialWorkerVersion,
              terminalUrl: terminalUrl.href,
              terminalStatus: terminal.status,
              terminalSiteVersion: terminal.headers.get("x-jakh-site-version"),
              terminalWorkerVersion: terminal.headers.get("x-jakh-worker-version"),
              safe: terminal.status === 200
                && initialSiteVersion === null
                && initialWorkerVersion === null
                && terminal.headers.get("x-jakh-site-version") === null
                && terminal.headers.get("x-jakh-worker-version") === null,
            };
            evidence.hosts.push(record);
          }
          await writeFile(
            join(process.env.RUNNER_TEMP, "legacy-pages-predeploy-hosts.json"),
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          const unsafe = evidence.hosts.filter(({ safe }) => !safe);
          if (unsafe.length) {
            throw new Error(`Legacy hosting safety gate failed for ${unsafe.map(({ requestedOrigin }) => requestedOrigin).join(", ")}`);
          }
          NODE

      - name: Install pinned validation dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit validation dependencies
        run: npm audit --audit-level=high

      - name: Validate source
        run: |
          node scripts/sync-catalog.mjs --check
          node scripts/generate-seo-pages.mjs --check
          node scripts/generate-arabic-routes.mjs --check
          node scripts/generate-search-index.mjs --check
          node scripts/generate-production-quarantine.mjs --check
          node scripts/content-review-report.mjs --check
          node scripts/audit-question-bank.mjs --strict
          node scripts/validate-seo.mjs
          node scripts/validate-static.mjs
          node scripts/validate-bilingual.mjs
          node scripts/validate-responsive-images.mjs
          node scripts/validate-game-focus.mjs
          npm run check:performance
          npm run test:contracts
          node --test \
            scripts/monitor-production.test.mjs \
            scripts/pages-quarantine-receipt.test.mjs \
            scripts/route-production-alert.test.mjs \
            scripts/runtime-monitor-proof.test.mjs

      - name: Install Playwright browser matrix
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Prepare exact artifact once
        run: |
          node scripts/build-static-site.mjs \
            --output _site \
            --manifest "$RUNNER_TEMP/legacy-pages-manifest.json" \
            --module "$RUNNER_TEMP/legacy-pages-manifest.js"

      - name: Run browser regression matrix against exact artifact
        env:
          JAKH_SITE_ROOT: ${{ github.workspace }}/_site
          JAKH_SITE_MANIFEST: ${{ runner.temp }}/legacy-pages-manifest.json
        run: npm run test:browser:matrix

      - name: Run WCAG browser suite against exact artifact
        env:
          JAKH_SITE_ROOT: ${{ github.workspace }}/_site
          JAKH_SITE_MANIFEST: ${{ runner.temp }}/legacy-pages-manifest.json
        run: npm run test:a11y

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify live Pages quarantine projection on apex
        id: quarantine_monitor_apex
        env:
          JAKH_MONITOR_SCOPE: pages
          JAKH_SITE_ORIGIN: https://jakh.net
          JAKH_MONITOR_RESULT_PATH: ${{ runner.temp }}/legacy-pages-monitor-apex.json
        run: node scripts/monitor-production.mjs

      - name: Verify live Pages quarantine projection on www
        id: quarantine_monitor_www
        env:
          JAKH_MONITOR_SCOPE: pages
          JAKH_SITE_ORIGIN: https://www.jakh.net
          JAKH_MONITOR_RESULT_PATH: ${{ runner.temp }}/legacy-pages-monitor-www.json
        run: node scripts/monitor-production.mjs

      - name: Create exact Pages rollback-baseline receipt
        if: ${{ always() && steps.deployment.outcome == 'success' }}
        env:
          JAKH_CHANGE_REFERENCE: ${{ inputs.incident_reference }}
        run: |
          node scripts/pages-quarantine-receipt.mjs create \
            --manifest "$RUNNER_TEMP/legacy-pages-manifest.json" \
            --predeploy-hosts "$RUNNER_TEMP/legacy-pages-predeploy-hosts.json" \
            --monitor-apex "$RUNNER_TEMP/legacy-pages-monitor-apex.json" \
            --monitor-www "$RUNNER_TEMP/legacy-pages-monitor-www.json" \
            --deployment-url "${{ steps.deployment.outputs.page_url }}" \
            --receipt "$RUNNER_TEMP/legacy-pages-quarantine-receipt.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Retain Pages quarantine and rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legacy-pages-quarantine-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/legacy-pages-manifest.json
            ${{ runner.temp }}/legacy-pages-predeploy-hosts.json
            ${{ runner.temp }}/legacy-pages-monitor-apex.json
            ${{ runner.temp }}/legacy-pages-monitor-www.json
            ${{ runner.temp }}/legacy-pages-quarantine-receipt.json

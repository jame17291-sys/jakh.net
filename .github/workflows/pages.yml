name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate source
        run: |
          node scripts/sync-catalog.mjs --check
          node scripts/generate-seo-pages.mjs --check
          node scripts/generate-search-index.mjs --check
          node scripts/audit-question-bank.mjs --strict
          node scripts/validate-seo.mjs
          node scripts/validate-static.mjs
          node scripts/validate-bilingual.mjs
          node --test scripts/monitor-production.test.mjs scripts/route-production-alert.test.mjs

      - name: Prepare artifact
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='worker' \
            --exclude='_site' \
            ./ _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

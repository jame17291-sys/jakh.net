name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='admin.html' \
            --exclude='category-template.html' \
            --exclude='api/' \
            --exclude='api-fresh/' \
            --exclude='backups/' \
            --exclude='Claude/' \
            --exclude='Users/' \
            --exclude='site/' \
            --exclude='site-fresh/' \
            --exclude='*.pem' \
            --exclude='*.zip' \
            --exclude='*.py' \
            --exclude='*_live.*' \
            --exclude='CLAUDE.md' \
            --exclude='mind-lab.html' \
            --exclude='nginx*' \
            --exclude='reset.js' \
            --exclude='test.js' \
            --exclude='.DS_Store' \
            --exclude='.gitignore' \
            ./ _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

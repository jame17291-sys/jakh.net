name: Monitor production

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Check jakh.net and API
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Test monitor behavior
        run: node --test scripts/monitor-production.test.mjs

      - name: Check production
        env:
          JAKH_SITE_ORIGIN: https://jakh.net
          JAKH_API_ORIGIN: https://api.jakh.net
          JAKH_MONITOR_TIMEOUT_MS: "10000"
          JAKH_SITE_MAX_MS: "5000"
          JAKH_API_MAX_MS: "5000"
        run: node scripts/monitor-production.mjs

name: Monitor production

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy GitHub Pages", "Deploy API"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check jakh.net and API
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Test monitor behavior
        run: node --test scripts/monitor-production.test.mjs scripts/route-production-alert.test.mjs

      - name: Check production
        id: production
        env:
          JAKH_SITE_ORIGIN: https://jakh.net
          JAKH_API_ORIGIN: https://api.jakh.net
          JAKH_MONITOR_TIMEOUT_MS: "10000"
          JAKH_SITE_MAX_MS: "5000"
          JAKH_API_MAX_MS: "5000"
          JAKH_MONITOR_ALLOW_COMPATIBLE_SCHEMA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy API' && startsWith(github.event.workflow_run.display_title, 'API compatibility ·') && 'true' || 'false' }}
          JAKH_MONITOR_RESULT_PATH: monitor-production-result.json
        run: node scripts/monitor-production.mjs

      - name: Route production failure or recovery
        if: ${{ always() && (steps.production.outcome == 'success' || steps.production.outcome == 'failure') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JAKH_ALERT_STATE: ${{ steps.production.outcome == 'success' && 'recovery' || 'failure' }}
          JAKH_ALERT_EVENT: ${{ github.event_name }}
          JAKH_ALERT_SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          JAKH_ALERT_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          JAKH_MONITOR_RESULT_PATH: monitor-production-result.json
        run: node scripts/route-production-alert.mjs

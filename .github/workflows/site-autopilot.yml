name: Daily website maintenance
run-name: Daily maintenance · ${{ github.sha }}

on:
  schedule:
    # 07:23 Dubai. Off the hour to reduce scheduler contention.
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      identity_check_only:
        description: "Verify maintenance identity without claiming the daily run or changing the website"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: riddle-arabia-autopilot
  cancel-in-progress: false

jobs:
  identity-check:
    name: Verify identity without claiming daily maintenance
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.identity_check_only == true &&
      github.repository == 'jame17291-sys/jakh.net' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Authenticate and require rejection before any daily claim
        run: node scripts/autopilot-client.mjs diagnose-identity "$RUNNER_TEMP/autopilot-identity.json"
      - name: Keep the nonsecret identity result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autopilot-identity-${{ github.run_id }}
          path: ${{ runner.temp }}/autopilot-identity.json
          if-no-files-found: ignore
          retention-days: 1
  # Maintenance is split by privilege. This job installs packages and runs
  # every check, so it gets a read-only token and no OIDC identity, deployment
  # environment or secret. It hands its results to the publish job as data.
  inspect:
    name: Inspect, repair and test (read-only)
    if: >-
      inputs.identity_check_only != true && github.repository == 'jame17291-sys/jakh.net' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only. actions: read lets the production check find the live releases
    # and their receipts, exactly like the scheduled production monitor.
    permissions:
      contents: read
      actions: read
    # Evaluated by GitHub, not by any step, so package code cannot change them.
    # "Re-run failed jobs" re-runs only publish, which still finds this attempt's hand-off.
    outputs:
      handoff: autopilot-handoff-${{ github.run_id }}-${{ github.run_attempt }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            site-worker/package-lock.json
      - name: Install pinned validation dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix worker --no-audit --no-fund
          npm ci --prefix site-worker --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium
      - name: Validate the immutable repair and release policy
        run: node --test scripts/autopilot-policy.test.mjs scripts/autopilot-repairs.test.mjs scripts/autopilot-orchestration.test.mjs scripts/autopilot-github-app.test.mjs
      - name: Inspect, repair locally and test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOPILOT_RELEASE_ENABLED: ${{ vars.AUTOPILOT_RELEASE_ENABLED }}
        run: node scripts/site-autopilot.mjs inspect
      - name: Hand the inspection results to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autopilot-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autopilot-${{ github.run_id }}/*.json
          if-no-files-found: error
          retention-days: 1

  # The writing job installs no packages. It claims the daily run with the
  # short-lived OIDC identity, reports to the website, files or closes the
  # findings issue, keeps the receipt and, only when automatic publishing is
  # enabled, publishes a repair it re-derives from the trusted base and binds
  # to the inspected tree. It fails visibly when findings need attention.
  publish:
    name: Record results and publish verified repairs
    needs: inspect
    if: >-
      inputs.identity_check_only != true && github.repository == 'jame17291-sys/jakh.net' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # Inspection needs no deployment environment or long-lived credentials.
    # Only explicitly enabled publishing reads the protected App environment.
    environment: ${{ vars.AUTOPILOT_RELEASE_ENABLED == 'true' && 'autopilot-production' || '' }}
    # The website verifies this workflow's short-lived OIDC identity. A separate,
    # repository-scoped App creates repair PRs so their required CI runs normally.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate the immutable repair and release policy
        run: node --test scripts/autopilot-policy.test.mjs scripts/autopilot-repairs.test.mjs scripts/autopilot-orchestration.test.mjs scripts/autopilot-github-app.test.mjs
      - name: Receive the inspection results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.inspect.outputs.handoff }}
          path: ${{ runner.temp }}/autopilot-${{ github.run_id }}
      - name: Record results, file findings and publish a verified repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOPILOT_RELEASE_ENABLED: ${{ vars.AUTOPILOT_RELEASE_ENABLED }}
          AUTOPILOT_GITHUB_APP_ID: ${{ vars.AUTOPILOT_GITHUB_APP_ID }}
          AUTOPILOT_GITHUB_APP_INSTALLATION_ID: ${{ vars.AUTOPILOT_GITHUB_APP_INSTALLATION_ID }}
          AUTOPILOT_GITHUB_APP_PRIVATE_KEY: ${{ secrets.AUTOPILOT_GITHUB_APP_PRIVATE_KEY }}
          AUTOPILOT_INSPECTION_ATTEMPT: ${{ needs.inspect.outputs.attempt }}
        run: node scripts/site-autopilot.mjs publish
      - name: Keep the small maintenance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autopilot-${{ github.run_id }}
          path: ${{ runner.temp }}/autopilot-${{ github.run_id }}/*.json
          if-no-files-found: ignore
          retention-days: 1

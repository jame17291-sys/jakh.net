    /* scoped backgammon styles */
    :root {
      --accent: #256aa9;
      --gilt: #976006;
      --easy: #1d7051;
      --danger: #b73545;
    }

    #bgSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      padding-top: 0.5rem;
      padding-bottom: 3rem;
    }

    /* ── Board container ────────────────────────────────────── */
    .bg-outer {
      width: min(700px, 100%);
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(32, 50, 71, 0.16);
    }

    .bg-board {
      background: #d9b57b;
      position: relative;
      width: 100%;
      /* height computed by JS */
    }

    .bg-half {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      padding: 0 4px;
    }

    .bg-bar-area {
      width: 36px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: rgba(32, 50, 71, 0.16);
    }

    .bg-bar-label {
      color: #162638;
      font-size: 0.8125rem;
      font-family: var(--font);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .bg-points-group {
      display: flex;
      flex: 1;
      gap: 2px;
    }

    /* Each point column */
    .bg-point {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      min-width: 0;
    }
    .bg-point:hover .bg-triangle { filter: brightness(1.25); }
    .bg-point.selected .bg-triangle { filter: brightness(1.5) drop-shadow(0 0 4px var(--accent)); }
    .bg-point.valid-dest .bg-triangle { filter: brightness(1.2) drop-shadow(0 0 3px var(--easy)); }

    /* Triangle using clip-path */
    .bg-triangle {
      width: 100%;
      transition: filter 0.15s;
    }
    .bg-triangle.gilt  { background: #f3d08a; }
    .bg-triangle.plum  { background: #7899bc; }

    /* Top triangles: point downward */
    .bg-top .bg-triangle {
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    /* Bottom triangles: point upward */
    .bg-bottom .bg-triangle {
      clip-path: polygon(50% 0, 0 100%, 100% 100%);
    }

    .bg-checkers-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding-top: 2px;
    }
    .bg-checkers-bottom {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 1px;
      padding-bottom: 2px;
    }

    /* Middle divider */
    .bg-mid {
      height: 20px;
      background: rgba(32, 50, 71, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg-mid-label {
      color: #162638;
      font-size: 0.8125rem;
      font-family: var(--font);
      letter-spacing: 0.1em;
    }

    /* Checker circle */
    .bg-checker {
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s;
      box-sizing: border-box;
    }
    .bg-checker:hover { transform: scale(1.08); }
    .bg-checker.w {
      background: #F0E8D8;
      border: 2px solid #aaa;
      color: #222;
    }
    .bg-checker.b {
      background: #13101a;
      border: 2px solid #555;
      color: #F0E8D8;
    }
    .bg-checker.selected-checker {
      outline: 3px solid var(--accent);
      outline-offset: 1px;
    }

    /* Point number labels */
    .bg-point-num {
      font-size: 0.8125rem;
      font-family: 'JetBrains Mono', monospace;
      color: #162638;
      text-align: center;
      line-height: 1;
      padding: 1px 0;
    }

    /* Bear-off zones */
    .bg-bearoff-zone {
      width: 44px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.22);
      border-left: 1px solid rgba(32, 50, 71, 0.12);
      border-right: 1px solid rgba(32, 50, 71, 0.12);
      padding: 4px 2px;
    }
    .bg-bearoff-label {
      font-size: 0.8125rem;
      font-family: var(--font);
      color: #162638;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .bg-bearoff-count {
      font-size: 1.1rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }
    .bg-bearoff-count.w { color: var(--ink); }
    .bg-bearoff-count.b { color: var(--gilt); }

    /* ── Control panel ──────────────────────────────────────── */
    .bg-controls {
      background: var(--panel);
      border-top: 1px solid var(--line-strong);
      padding: 1rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .bg-info-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .bg-turn-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font);
      font-size: 0.95rem;
      color: var(--text);
    }
    .bg-turn-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(240,232,216,0.3);
    }
    .bg-turn-dot.w { background: #F0E8D8; }
    .bg-turn-dot.b { background: #13101a; }

    .bg-status-msg {
      font-family: var(--font);
      font-size: 0.875rem;
      color: var(--muted);
    }
    .bg-status-msg.ok  { color: var(--easy); font-weight: 600; }
    .bg-status-msg.err { color: var(--danger); }

    /* Dice */
    .bg-dice-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .bg-die {
      width: 38px; height: 38px;
      background: var(--panel-strong);
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 5px;
      position: relative;
    }
    .bg-die.used { opacity: 0.3; }

    .bg-die-pip {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text);
      flex-shrink: 0;
    }

    /* Buttons */
    .bg-btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .bg-btn {
      padding: 0.55rem 1.1rem;
      min-height: 44px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    .bg-btn:active { transform: scale(0.97); }
    .bg-btn.primary { background: var(--accent); color: #fff; }
    .bg-btn.secondary { background: var(--bg-soft); color: var(--text); border: 1px solid var(--line-strong); }
    .bg-btn.ai-btn { background: rgba(200,162,39,0.18); color: var(--gilt); border: 1px solid rgba(200,162,39,0.3); }
    .bg-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Mode toggle */
    .bg-mode-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font);
      font-size: 0.82rem;
      color: var(--muted);
    }
    .bg-mode-row label { cursor: pointer; }

    /* Result banner */
    .bg-result-banner {
      background: var(--panel-strong);
      border: 1px solid var(--gilt);
      border-radius: var(--radius);
      padding: 1.25rem 1.75rem;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      font-family: var(--font);
      width: min(420px, calc(100vw - 2rem));
    }
    .bg-result-banner.visible { display: flex; }
    .bg-result-banner h2 { color: var(--gilt); margin: 0; font-size: 1.4rem; }
    .bg-result-banner p  { color: var(--text); margin: 0; }

    /* Point number row below board */
    .bg-num-row {
      display: flex;
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 4px;
    }
    .bg-num-cell {
      flex: 1;
      font-size: 0.8125rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      text-align: center;
    }
    .bg-num-spacer { width: 36px; flex-shrink: 0; }

    @media (max-width: 480px) {
      .bg-controls { flex-direction: column; align-items: flex-start; }
      .bg-outer {
        overflow: hidden;
      }
      .bg-half,
      .bg-mid {
        width: 100%;
        min-width: 0;
      }
      .bg-half {
        gap: 0 !important;
        padding-inline: 0 !important;
      }
      .bg-points-group { gap: 0 !important; }
      .bg-point { min-width: 0; }
      .bg-bar-area {
        width: 22px !important;
        min-width: 22px;
      }
      .bg-bearoff-zone {
        width: 26px !important;
        min-width: 26px;
        padding-inline: 1px !important;
      }
      .bg-bar-label,
      .bg-bearoff-label {
        max-width: 100%;
        overflow-wrap: anywhere;
        font-size: 0.625rem !important;
        line-height: 1.05;
        letter-spacing: 0 !important;
      }
    }
  </style>

  <script id="backgammon-engine">
  var BackgammonEngine = (function() {
    'use strict';

    // Points array indices:
    //   0  = white bar (white pieces that have been hit)
    //   25 = black bar (black pieces that have been hit)
    //   1-24 = board points
    // White moves: 24 → 1, bears off at < 1 (index 0 = bear-off target direction)
    // Black moves: 1 → 24, bears off at > 24 (index 25 = bear-off target direction)

    function newGame() {
      var points = [];
      for (var i = 0; i < 26; i++) points.push({ color: null, count: 0 });

      // Standard backgammon starting position
      // White checkers (color 'w'): moves from high to low (24→1)
      // Black checkers (color 'b'): moves from low to high (1→24)
      function place(idx, color, count) { points[idx] = { color: color, count: count }; }

      place(24, 'w', 2);
      place(13, 'w', 5);
      place(8,  'w', 3);
      place(6,  'w', 5);

      place(1,  'b', 2);
      place(12, 'b', 5);
      place(17, 'b', 3);
      place(19, 'b', 5);

      return {
        points: points,
        turn: 'w',
        dice: [],
        usedDice: [],
        borneOff: { w: 0, b: 0 },
        mustRoll: true,
        phase: 'roll' // 'roll' | 'move'
      };
    }

    function clonePoints(points) {
      return points.map(function(p) { return { color: p.color, count: p.count }; });
    }

    function cloneState(state) {
      return {
        points: clonePoints(state.points),
        turn: state.turn,
        dice: state.dice.slice(),
        usedDice: state.usedDice.slice(),
        borneOff: { w: state.borneOff.w, b: state.borneOff.b },
        mustRoll: state.mustRoll,
        phase: state.phase
      };
    }

    function rollDice() {
      var d1 = Math.ceil(Math.random() * 6);
      var d2 = Math.ceil(Math.random() * 6);
      if (d1 === d2) return [d1, d1, d1, d1];
      return [d1, d2];
    }

    function barPoint(color) { return color === 'w' ? 0 : 25; }
    function direction(color) { return color === 'w' ? -1 : 1; }
    function homeRange(color) {
      // White home board: points 1-6; Black home board: points 19-24
      return color === 'w' ? { lo: 1, hi: 6 } : { lo: 19, hi: 24 };
    }

    function hasOnBar(state, color) {
      var bar = state.points[barPoint(color)];
      return bar.color === color && bar.count > 0;
    }

    function canBearOff(state, color) {
      if (hasOnBar(state, color)) return false;
      var home = homeRange(color);
      var total = 0;
      for (var i = 1; i <= 24; i++) {
        if (state.points[i].color === color) {
          if (i < home.lo || i > home.hi) return false;
          total += state.points[i].count;
        }
      }
      return true;
    }

    function getStatus(state) {
      if (state.borneOff.w >= 15) return 'white-wins';
      if (state.borneOff.b >= 15) return 'black-wins';
      return 'playing';
    }

    // Returns all legal {from, to, die} moves for the current player given remaining dice
    function getLegalMoves(state) {
      var color = state.turn;
      var dir = direction(color);
      var remaining = remainingDice(state);
      if (remaining.length === 0) return [];

      var moves = [];
      var uniqueDice = [];
      remaining.forEach(function(d) {
        if (uniqueDice.indexOf(d) === -1) uniqueDice.push(d);
      });

      var onBar = hasOnBar(state, color);

      uniqueDice.forEach(function(die) {
        if (onBar) {
          // Must enter from bar
          var from = barPoint(color);
          var to = color === 'w' ? (25 - die) : die;
          if (to >= 1 && to <= 24) {
            var dest = state.points[to];
            if (dest.color === null || dest.color === color || dest.count === 1) {
              moves.push({ from: from, to: to, die: die });
            }
          }
        } else if (canBearOff(state, color)) {
          // Bearing off
          var home = homeRange(color);
          for (var i = home.lo; i <= home.hi; i++) {
            var pt = state.points[i];
            if (pt.color !== color || pt.count === 0) continue;
            var target = i + dir * die;
            if (target === (color === 'w' ? 0 : 25)) {
              // Exact bear-off
              moves.push({ from: i, to: target, die: die });
            } else if (color === 'w' && target < 0) {
              // Overshoot — only if no checker on higher points
              var anyHigher = false;
              for (var j = i + 1; j <= 6; j++) {
                if (state.points[j].color === 'w' && state.points[j].count > 0) { anyHigher = true; break; }
              }
              if (!anyHigher) moves.push({ from: i, to: 0, die: die });
            } else if (color === 'b' && target > 25) {
              var anyLower = false;
              for (var j = 19; j < i; j++) {
                if (state.points[j].color === 'b' && state.points[j].count > 0) { anyLower = true; break; }
              }
              if (!anyLower) moves.push({ from: i, to: 25, die: die });
            } else if (target >= 1 && target <= 24) {
              var dest = state.points[target];
              if (dest.color === null || dest.color === color || dest.count === 1) {
                moves.push({ from: i, to: target, die: die });
              }
            }
          }
        } else {
          // Normal movement
          for (var i = 1; i <= 24; i++) {
            var pt = state.points[i];
            if (pt.color !== color || pt.count === 0) continue;
            var target = i + dir * die;
            if (target < 1 || target > 24) continue;
            var dest = state.points[target];
            if (dest.color === null || dest.color === color || dest.count === 1) {
              moves.push({ from: i, to: target, die: die });
            }
          }
        }
      });

      // Deduplicate
      var seen = {};
      return moves.filter(function(m) {
        var k = m.from + '_' + m.to + '_' + m.die;
        if (seen[k]) return false;
        seen[k] = true;
        return true;
      });
    }

    function remainingDice(state) {
      var all = state.dice.slice();
      var used = state.usedDice.slice();
      var rem = [];
      all.forEach(function(d) {
        var idx = used.indexOf(d);
        if (idx === -1) rem.push(d);
        else used.splice(idx, 1);
      });
      return rem;
    }

    function applyMove(state, move) {
      var ns = cloneState(state);
      var color = ns.turn;
      var opp = color === 'w' ? 'b' : 'w';
      var from = move.from;
      var to = move.to;

      // Remove from source
      ns.points[from].count--;
      if (ns.points[from].count === 0) ns.points[from].color = null;

      // Handle bear-off
      if (to === 0 || to === 25) {
        ns.borneOff[color]++;
        ns.usedDice.push(move.die);
        // Check if no more dice or no legal moves → switch turn
        var rem = remainingDice(ns);
        if (rem.length === 0 || getLegalMoves(ns).length === 0) {
          ns.turn = opp;
          ns.dice = [];
          ns.usedDice = [];
          ns.phase = 'roll';
        }
        return ns;
      }

      // Hit opponent blot?
      var dest = ns.points[to];
      if (dest.color === opp && dest.count === 1) {
        // Send to bar
        ns.points[to].count = 0;
        ns.points[to].color = null;
        var oppBar = barPoint(opp);
        ns.points[oppBar].count++;
        ns.points[oppBar].color = opp;
      }

      // Place on destination
      if (ns.points[to].color === null || ns.points[to].count === 0) {
        ns.points[to] = { color: color, count: 1 };
      } else {
        ns.points[to].count++;
      }

      ns.usedDice.push(move.die);

      // If no remaining dice or no legal moves → switch turn
      var rem = remainingDice(ns);
      if (rem.length === 0 || getLegalMoves(ns).length === 0) {
        ns.turn = opp;
        ns.dice = [];
        ns.usedDice = [];
        ns.phase = 'roll';
      }

      return ns;
    }

    function applyRoll(state) {
      var ns = cloneState(state);
      ns.dice = rollDice();
      ns.usedDice = [];
      ns.phase = 'move';
      // If no legal moves at all, skip turn
      if (getLegalMoves(ns).length === 0) {
        ns.turn = ns.turn === 'w' ? 'b' : 'w';
        ns.dice = [];
        ns.usedDice = [];
        ns.phase = 'roll';
      }
      return ns;
    }

    // AI: greedy — prefer hitting blots, then making points, then bearing off
    function getAIMove(state) {
      var moves = getLegalMoves(state);
      if (moves.length === 0) return null;
      var color = state.turn;
      var opp = color === 'w' ? 'b' : 'w';

      // Score each move
      function scoreMove(m) {
        var s = 0;
        var dest = state.points[m.to];
        // Hit a blot
        if (dest.color === opp && dest.count === 1) s += 100;
        // Make a point (land where we already have 1)
        if (dest.color === color && dest.count === 1) s += 50;
        // Bearing off
        if (m.to === 0 || m.to === 25) s += 200;
        // Prefer larger dice usage (advance more)
        s += m.die;
        // Prefer moving from bar
        if (m.from === 0 || m.from === 25) s += 80;
        return s;
      }

      moves.sort(function(a, b) { return scoreMove(b) - scoreMove(a); });
      return moves[0];
    }

    return { newGame, rollDice, getLegalMoves, applyMove, applyRoll, canBearOff, getStatus, getAIMove, remainingDice };
  })();

      var lbl = document.createElement('div');
      lbl.className = 'bg-bearoff-label';
      lbl.style.cssText = 'font-size:0.8125rem;font-family:var(--font);color:#162638;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;text-align:center;';
      lbl.textContent = I.t(color === 'w' ? 'whiteOff' : 'blackOff');
      lbl.dir = I.dir;

      var cnt = document.createElement('div');
      cnt.style.cssText = 'font-size:1.2rem;font-family:var(--font-mono);font-weight:700;'
        + (color === 'w' ? 'color:var(--ink);' : 'color:var(--gilt);');
      cnt.textContent = I.number(state.borneOff[color]);
      div.setAttribute('aria-label', I.t('bearOffLabel', {
        color: I.t(color === 'w' ? 'white' : 'black'),
        count: I.number(state.borneOff[color])
      }));

      // Also make bear-off zone clickable as destination when bearing off
      div.dataset.bearoff = color;
      div.style.cursor = 'pointer';
      div.addEventListener('click', function() {
        if (selectedFrom !== null && state.phase === 'move') {
          var dest = color === 'w' ? 0 : 25;
          // Check if this is a valid destination
          var legalMoves = BackgammonEngine.getLegalMoves(state);
          var valid = legalMoves.some(function(m) { return m.from === selectedFrom && m.to === dest; });
          if (valid) applySelectedMove(dest);
        }
      });
      div.addEventListener('keydown', function(event) {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        if (selectedFrom === null || state.phase !== 'move') return;
        var dest = color === 'w' ? 0 : 25;
        var legalMoves = BackgammonEngine.getLegalMoves(state);
        if (legalMoves.some(function(m) { return m.from === selectedFrom && m.to === dest; })) {
          applySelectedMove(dest);
        }
      });

      div.appendChild(lbl);
      div.appendChild(cnt);
      return div;
    }

    function buildControls() {
      var ctrl = document.createElement('div');
      ctrl.dir = I.dir;
      ctrl.style.cssText = 'background:var(--panel);border-top:1px solid var(--line-strong);padding:0.9rem 1.1rem;display:flex;flex-wrap:wrap;gap:0.85rem;align-items:center;justify-content:space-between;';

      // Left: turn info + status
      var infoGroup = document.createElement('div');
      infoGroup.style.cssText = 'display:flex;flex-direction:column;gap:0.3rem;';

      var turnRow = document.createElement('div');
      turnRow.style.cssText = 'display:flex;align-items:center;gap:0.5rem;font-family: var(--font);font-size:0.92rem;color:var(--text);';

      var dot = document.createElement('div');
      dot.style.cssText = 'width:15px;height:15px;border-radius:50%;flex-shrink:0;border:2px solid rgba(240,232,216,0.3);'
        + (state.turn === 'w' ? 'background:#F0E8D8;' : 'background:#13101a;');

      var turnLbl = document.createElement('span');
      var playerName = I.t(state.turn === 'w' ? 'white' : 'black');
      var isAIturn = vsAI && state.turn === aiColor;
      turnLbl.textContent = I.t(isAIturn ? 'aiTurn' : 'turn', { color: playerName });

      turnRow.appendChild(dot);
      turnRow.appendChild(turnLbl);

      var statusMsg = document.createElement('div');
      statusMsg.id = 'bgStatus';
      statusMsg.style.cssText = 'font-family:var(--font);font-size:0.8125rem;color:var(--muted);';
      statusMsg.setAttribute('role', 'status');
      statusMsg.setAttribute('aria-live', 'polite');
      if (state.phase === 'roll') statusMsg.textContent = I.t('rollPrompt');
      else if (state.dice.length > 0) {
        var rem = BackgammonEngine.remainingDice(state);
        statusMsg.textContent = I.t('diceStatus', {
          dice: '\u2066' + state.dice.map(function(value) { return I.number(value); }).join(', ') + '\u2069',
          count: I.number(rem.length)
        });
      }
      if (selectedFrom !== null) {
        statusMsg.textContent = I.t('selectedFrom', {
          place: selectedFrom === 0 || selectedFrom === 25
            ? I.t('barName')
            : I.t('pointName', { point: I.number(selectedFrom) })
        });
        statusMsg.style.color = 'var(--easy)';
      }

      infoGroup.appendChild(turnRow);
      infoGroup.appendChild(statusMsg);

      // Center: dice display
      var diceRow = document.createElement('div');
      diceRow.setAttribute('role', 'group');
      diceRow.style.cssText = 'display:flex;gap:0.45rem;align-items:center;';

      if (state.dice.length > 0) {
        var usedCount = {};
        state.usedDice.forEach(function(d) { usedCount[d] = (usedCount[d] || 0) + 1; });
        var tempCount = Object.assign({}, usedCount);
        state.dice.forEach(function(d) {
          var isUsed = (tempCount[d] || 0) > 0;
          if (isUsed) tempCount[d]--;
          diceRow.appendChild(renderDie(d, isUsed));
        });
      }

      // Right: buttons
      var btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:0.45rem;flex-wrap:wrap;align-items:center;';

      var rollBtn = document.createElement('button');
      rollBtn.type = 'button';
      rollBtn.className = 'bg-btn primary';
      rollBtn.textContent = I.t('rollDice');
      rollBtn.disabled = state.phase !== 'roll' || (vsAI && state.turn === aiColor);
      rollBtn.style.cssText = 'padding:0.52rem 1rem;border-radius:var(--radius-sm);border:none;cursor:pointer;font-family: var(--font);font-size:0.86rem;font-weight:600;background:var(--accent);color:#fff;';
      if (rollBtn.disabled) rollBtn.style.opacity = '0.4';
      rollBtn.addEventListener('click', function() {
        if (state.phase !== 'roll') return;
        state = BackgammonEngine.applyRoll(state);
        selectedFrom = null;
        render();
        // If AI's turn after roll, trigger AI
        if (vsAI && state.turn === aiColor && state.phase === 'move') {
          scheduleAI();
        }
      });

      var newBtn = document.createElement('button');
      newBtn.type = 'button';
      newBtn.style.cssText = 'padding:0.52rem 1rem;border-radius:var(--radius-sm);border:1px solid var(--line-strong);cursor:pointer;font-family: var(--font);font-size:0.86rem;font-weight:600;background:rgba(246,239,224,0.1);color:var(--text);';
      newBtn.textContent = I.t('newGame');
      newBtn.addEventListener('click', startNew);

      // Mode toggle
      var modeLabel = document.createElement('label');
      modeLabel.style.cssText = 'display:flex;align-items:center;gap:0.35rem;font-family:var(--font);font-size:0.8125rem;color:var(--muted);cursor:pointer;';
      var modeCheck = document.createElement('input');
      modeCheck.type = 'checkbox';
      modeCheck.checked = vsAI;
      modeCheck.addEventListener('change', function() {
        vsAI = modeCheck.checked;
        startNew();
      });
      modeLabel.appendChild(modeCheck);
      var modeText = document.createElement('span');
      modeText.textContent = I.t('versusAI');
      modeLabel.appendChild(modeText);

      btnRow.appendChild(rollBtn);
      btnRow.appendChild(newBtn);
      btnRow.appendChild(modeLabel);

      ctrl.appendChild(infoGroup);
      ctrl.appendChild(diceRow);
      ctrl.appendChild(btnRow);
      boardEl.appendChild(ctrl);
    }

    // ── Point click logic ─────────────────────────────────────
    function handlePointClick(ptIdx) {
      if (state.phase !== 'move') return;
      var isAIturn = vsAI && state.turn === aiColor;
      if (isAIturn) return;

      var pt = state.points[ptIdx];
      var legalMoves = BackgammonEngine.getLegalMoves(state);

      if (selectedFrom === null) {
        // Select a checker
        var hasOnBar = BackgammonEngine.remainingDice(state).length > 0
          && state.points[state.turn === 'w' ? 0 : 25].color === state.turn
          && state.points[state.turn === 'w' ? 0 : 25].count > 0;

        if (hasOnBar) {
          // Must move from bar
          var barIdx = state.turn === 'w' ? 0 : 25;
          if (ptIdx === barIdx) {
            selectedFrom = ptIdx;
            render();
          }
          return;
        }

        if (pt.color === state.turn && pt.count > 0) {
          var canMove = legalMoves.some(function(m) { return m.from === ptIdx; });
          if (canMove) { selectedFrom = ptIdx; render(); }
        }
      } else {
        // Try to move to this destination
        applySelectedMove(ptIdx);
      }
    }

    function applySelectedMove(toPt) {
      var legalMoves = BackgammonEngine.getLegalMoves(state);
      var validMoves = legalMoves.filter(function(m) { return m.from === selectedFrom && m.to === toPt; });

      if (validMoves.length === 0) {
        // Maybe clicked another own checker — reselect
        var pt = state.points[toPt];
        if (pt.color === state.turn && pt.count > 0) {
          var canMove = legalMoves.some(function(m) { return m.from === toPt; });
          if (canMove) { selectedFrom = toPt; render(); return; }
        }
        selectedFrom = null;
        render();
        return;
      }

      // Prefer largest die for the move (or exact bear-off)
      validMoves.sort(function(a, b) { return b.die - a.die; });
      var move = validMoves[0];

      var prevTurn = state.turn;
      state = BackgammonEngine.applyMove(state, move);
      selectedFrom = null;

      var status = BackgammonEngine.getStatus(state);
      if (status !== 'playing') {
        render();
        showResult(status);
        return;
      }

      render();

      // If turn changed to AI, schedule AI
      if (vsAI && state.turn === aiColor && state.phase === 'roll') {
        scheduleAIRoll();
      }
    }

    // ── AI ────────────────────────────────────────────────────
    function scheduleAIRoll() {
      if (aiThinking) return;
      aiThinking = true;
      state = BackgammonEngine.applyRoll(state);
      render();
      if (state.phase === 'move') {
        scheduleAI();
      } else {
        aiThinking = false;
      }
    }

    function scheduleAI() {
      aiStep();
    }

    function aiStep() {
      if (BackgammonEngine.getStatus(state) !== 'playing') { aiThinking = false; return; }
      if (state.turn !== aiColor || state.phase !== 'move') { aiThinking = false; return; }

      var move = BackgammonEngine.getAIMove(state);
      if (!move) { aiThinking = false; return; }

      state = BackgammonEngine.applyMove(state, move);
      render();

      var status = BackgammonEngine.getStatus(state);
      if (status !== 'playing') { aiThinking = false; showResult(status); return; }

      // If AI still has moves (same turn), continue
      if (state.turn === aiColor && state.phase === 'move') {
        aiStep();
      } else if (state.turn === aiColor && state.phase === 'roll') {
        scheduleAIRoll();
      } else {
        aiThinking = false;
      }
    }

    // ── Result ────────────────────────────────────────────────
    function showResult(status) {
      resultStatus = status;
      resultBanner.classList.add('visible');
      resultTitle.textContent = I.t(status === 'white-wins' ? 'whiteWins' : 'blackWins');
      var isHuman = !(vsAI && ((status === 'white-wins' && aiColor === 'w') || (status === 'black-wins' && aiColor === 'b')));
      resultDesc.textContent = I.t(isHuman ? 'congratulations' : (vsAI ? 'aiWon' : 'gameOver'));
    }

    playAgainBtn.addEventListener('click', startNew);

    function startNew() {
      state = BackgammonEngine.newGame();
      selectedFrom = null;
      aiThinking = false;
      resultStatus = null;
      resultBanner.classList.remove('visible');
      render();
      // If AI goes first (black, but white starts — so AI only moves after white rolls)
      // White always starts first move
    }

    // ── Main render ───────────────────────────────────────────
    function render() {
      buildBoard();
    }

    // ── Responsive resize ─────────────────────────────────────
    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 100);
    });

    I.onChange(function() {
      render();
      if (resultStatus) showResult(resultStatus);
    });

    // ── Init ──────────────────────────────────────────────────
    I.apply();
    render();

  })();
  </script>
</body>
</html>

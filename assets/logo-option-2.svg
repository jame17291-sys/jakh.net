<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c9bff"/>
      <stop offset="50%" style="stop-color:#8f6bff"/>
      <stop offset="100%" style="stop-color:#18d7c0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Brain + question mark icon -->
  <!-- Brain left lobe -->
  <path d="M20 38 C20 28 26 20 34 20 C38 20 41 22 43 26 C45 22 48 20 52 20 C60 20 66 28 66 38 C66 50 58 58 44 62 C30 58 20 50 20 38Z" fill="none" stroke="url(#g1)" stroke-width="2"/>
  <!-- Brain wrinkle lines -->
  <path d="M30 32 C33 28 38 28 40 32" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.6"/>
  <path d="M48 32 C50 28 55 28 58 32" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.6"/>
  <path d="M28 44 C32 40 36 42 38 46" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.6"/>
  <!-- Question mark overlaid -->
  <text x="44" y="46" font-family="Georgia, serif" font-size="16" font-weight="700" fill="url(#g1)" text-anchor="middle" filter="url(#glow)">?</text>

  <!-- JAKH bold text -->
  <text x="82" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="white" letter-spacing="1">JAKH</text>

  <!-- Gradient underline accent -->
  <rect x="82" y="50" width="100" height="3" rx="1.5" fill="url(#g1)"/>

  <!-- Tagline -->
  <text x="82" y="68" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8f9bb3" letter-spacing="2.5">BILINGUAL BRAIN TEASERS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c9bff"/>
      <stop offset="100%" style="stop-color:#18d7c0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8f6bff"/>
      <stop offset="100%" style="stop-color:#18d7c0"/>
    </linearGradient>
  </defs>

  <!-- Two interlocking chat/speech bubbles (EN+AR dialogue concept) -->
  <!-- Left bubble (English) -->
  <rect x="4" y="10" width="40" height="28" rx="8" fill="none" stroke="url(#g1)" stroke-width="2"/>
  <polygon points="14,38 8,48 22,38" fill="none" stroke="url(#g1)" stroke-width="2"/>
  <text x="24" y="29" font-family="Georgia, serif" font-size="14" font-weight="700" fill="url(#g1)" text-anchor="middle">?</text>

  <!-- Right bubble (Arabic) — mirrored -->
  <rect x="30" y="20" width="38" height="26" rx="8" fill="url(#g2)" opacity="0.12"/>
  <rect x="30" y="20" width="38" height="26" rx="8" fill="none" stroke="url(#g2)" stroke-width="2"/>
  <polygon points="58,46 66,54 50,46" fill="none" stroke="url(#g2)" stroke-width="2"/>
  <text x="49" y="37" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="url(#g2)" text-anchor="middle">؟</text>

  <!-- JAKH text - bold, modern -->
  <text x="84" y="40" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="900" fill="url(#g1)" letter-spacing="2">JAKH</text>

  <!-- EN | AR pill -->
  <rect x="84" y="50" width="48" height="16" rx="8" fill="url(#g1)" opacity="0.15"/>
  <text x="108" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="url(#g1)" text-anchor="middle" font-weight="600" letter-spacing="1">EN · AR</text>

  <!-- Riddles wordmark -->
  <text x="138" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8f9bb3" letter-spacing="2" font-weight="400">RIDDLES</text>
</svg>

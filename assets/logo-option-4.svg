<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c9bff"/>
      <stop offset="100%" style="stop-color:#18d7c0"/>
    </linearGradient>
    <linearGradient id="gbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c9bff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#18d7c0;stop-opacity:0.15"/>
    </linearGradient>
  </defs>

  <!-- Stacked letter J as a stylized mark -->
  <!-- Outer circle glow ring -->
  <circle cx="38" cy="40" r="30" fill="url(#gbg)" stroke="url(#g1)" stroke-width="1.5" opacity="0.6"/>

  <!-- J letter inside circle -->
  <text x="38" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="900" fill="url(#g1)" text-anchor="middle">J</text>

  <!-- Small ? orbiting -->
  <circle cx="60" cy="18" r="10" fill="url(#gbg)" stroke="url(#g1)" stroke-width="1.5"/>
  <text x="60" y="23" font-family="Georgia, serif" font-size="11" font-weight="700" fill="url(#g1)" text-anchor="middle">?</text>

  <!-- AKH in large letters aligned with J -->
  <text x="80" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="white" letter-spacing="2">AKH</text>

  <!-- Gradient stroke under JAKH -->
  <line x1="80" y1="56" x2="188" y2="56" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Subtitle double-language -->
  <text x="80" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#8f9bb3" letter-spacing="2">RIDDLES · ألغاز</text>
</svg>

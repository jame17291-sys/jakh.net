<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64">
  <defs>
    <linearGradient id="ga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c9bff"/>
      <stop offset="100%" stop-color="#18d7c0"/>
    </linearGradient>
    <linearGradient id="gb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8f6bff"/>
      <stop offset="100%" stop-color="#7c9bff"/>
    </linearGradient>
  </defs>

  <!-- Left speech bubble (English) -->
  <rect x="2" y="6" width="34" height="26" rx="7" fill="url(#ga)" opacity="0.12"/>
  <rect x="2" y="6" width="34" height="26" rx="7" fill="none" stroke="url(#ga)" stroke-width="1.8"/>
  <polygon points="8,32 4,42 18,32" fill="url(#ga)" opacity="0.55"/>
  <text x="19" y="24" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="700" fill="url(#ga)" text-anchor="middle">?</text>

  <!-- Right speech bubble (Arabic) — offset, overlapping slightly -->
  <rect x="26" y="16" width="34" height="26" rx="7" fill="url(#gb)" opacity="0.12"/>
  <rect x="26" y="16" width="34" height="26" rx="7" fill="none" stroke="url(#gb)" stroke-width="1.8"/>
  <polygon points="50,42 56,52 40,42" fill="url(#gb)" opacity="0.55"/>
  <text x="43" y="34" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="url(#gb)" text-anchor="middle">؟</text>

  <!-- JAKH wordmark -->
  <text x="74" y="40" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="900" fill="url(#ga)" letter-spacing="1" text-anchor="start">JAKH</text>

  <!-- Thin gradient rule below wordmark -->
  <rect x="74" y="45" width="96" height="2" rx="1" fill="url(#ga)" opacity="0.6"/>

  <!-- EN · AR tagline -->
  <text x="74" y="59" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="500" fill="#8f9bb3" letter-spacing="3">EN · AR · RIDDLES</text>
</svg>

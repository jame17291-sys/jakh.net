    <!-- SECTION 1: HEADLESS MASTERMIND ENGINE (zero DOM)   -->
    <!-- ═══════════════════════════════════════════════════ -->
    <script id="mastermind-engine">
    const MastermindEngine = (() => {
      const COLORS = [
        '#E8613C', // 0 Ember
        '#C9A227', // 1 Gold
        '#48d597', // 2 Mint
        '#9f7cff', // 3 Violet
        '#ff7a8a', // 4 Rose
        '#26C6DA', // 5 Cyan
        '#F0E8D8', // 6 Parchment
        '#6B4E8C', // 7 Plum
      ];
      const COLOR_NAMES = ['Ember', 'Gold', 'Mint', 'Violet', 'Rose', 'Cyan', 'Parchment', 'Plum'];
      const CODE_LENGTH = 4;
      const MAX_ATTEMPTS = 10;
      const NUM_COLORS = COLORS.length; // 8

      // ── Encode / decode helpers ──────────────────────────
      // A code is an array of 4 ints [0..7]. We also work with
      // flat integer keys: c[0]*512 + c[1]*64 + c[2]*8 + c[3]
      function encode(code) {
        return code[0] * 512 + code[1] * 64 + code[2] * 8 + code[3];
      }
      function decode(key) {
        const c = [];
        let k = key;
        for (let i = 0; i < CODE_LENGTH; i++) {
          c.unshift(k % NUM_COLORS);
          k = Math.floor(k / NUM_COLORS);
        }
        return c;
      }

      // ── Score two codes (no secret needed externally) ────
      function scoreCodes(secret, guess) {
        let blacks = 0;
        let whites = 0;
        const sc = new Array(NUM_COLORS).fill(0);
        const gc = new Array(NUM_COLORS).fill(0);
        for (let i = 0; i < CODE_LENGTH; i++) {
          if (secret[i] === guess[i]) {
            blacks++;
          } else {
            sc[secret[i]]++;
            gc[guess[i]]++;
          }
        }
        for (let c = 0; c < NUM_COLORS; c++) {
          whites += Math.min(sc[c], gc[c]);
        }
        return { blacks, whites };
      }

      // ── All 8^4 = 4096 possible codes ───────────────────
      const ALL_CODES = [];
      for (let i = 0; i < 4096; i++) {
        ALL_CODES.push(decode(i));
      }

      // ── newGame ──────────────────────────────────────────
      function newGame() {
        const secret = [];
        for (let i = 0; i < CODE_LENGTH; i++) {
          secret.push(Math.floor(Math.random() * NUM_COLORS));
        }
        return {
          secret,
          attempts: [],
          status: 'playing', // 'playing' | 'won' | 'lost'
          maxAttempts: MAX_ATTEMPTS,
        };
      }

      // ── guess ────────────────────────────────────────────
      function guess(state, code) {
        if (state.status !== 'playing') return state;
        const { blacks, whites } = scoreCodes(state.secret, code);
        const attempt = { code: [...code], blacks, whites };
        const attempts = [...state.attempts, attempt];
        let status = 'playing';
        if (blacks === CODE_LENGTH) {
          status = 'won';
        } else if (attempts.length >= MAX_ATTEMPTS) {
          status = 'lost';
        }
        return { ...state, attempts, status };
      }

      // ── isWin / isLoss ───────────────────────────────────
      function isWin(attempt) {
        return attempt.blacks === CODE_LENGTH;
      }
      function isLoss(state) {
        return state.status === 'lost';
      }

      // ── Knuth minimax hint ───────────────────────────────
      // Maintains a remaining-possibilities set. Picks the guess
      // that minimises the worst-case count of remaining codes
      // after any possible feedback response.
      //
      // The classic first guess is [0,0,1,1] (two pairs) which
      // guarantees a win in ≤5 guesses. We use the full minimax.

      function getHint(state) {
        if (state.status !== 'playing') return null;

        // Filter ALL_CODES to those still consistent with all attempts
        let remaining = ALL_CODES.filter(candidate => {
          return state.attempts.every(attempt => {
            const fb = scoreCodes(candidate, attempt.code);
            return fb.blacks === attempt.blacks && fb.whites === attempt.whites;
          });
        });

        if (remaining.length === 0) return null;
        if (remaining.length === 1) return [...remaining[0]];

        // On first move Knuth's canonical first guess is fastest
        if (state.attempts.length === 0) {
          return [0, 0, 1, 1];
        }

        // Minimax: for each candidate guess (from ALL_CODES), compute
        // the worst-case size of the partitioned remaining set.
        // Among all guesses prefer ones in `remaining` (breaks ties).
        let bestScore = Infinity;
        let bestGuess = remaining[0];
        let bestInRemaining = remaining.some(r => encode(r) === encode(remaining[0]));

        // To keep this fast in the browser we only evaluate from
        // remaining when remaining <= 20, else we search all 4096.
        const searchSet = remaining.length <= 20 ? remaining : ALL_CODES;

        for (const candidate of searchSet) {
          // Partition remaining by (blacks, whites) response
          const partition = new Map(); // key = blacks*5+whites → count
          for (const poss of remaining) {
            const fb = scoreCodes(poss, candidate);
            const key = fb.blacks * 5 + fb.whites;
            partition.set(key, (partition.get(key) || 0) + 1);
          }
          // worst-case bucket size
          let worst = 0;
          for (const count of partition.values()) {
            if (count > worst) worst = count;
          }
          const inRemaining = remaining === searchSet; // always true when short
          const prefer = inRemaining && partition.has(CODE_LENGTH * 5 + 0); // winning guess

          if (worst < bestScore || (worst === bestScore && prefer)) {
            bestScore = worst;
            bestGuess = candidate;
          }
        }

        return [...bestGuess];
      }

      return {
        COLORS,
        COLOR_NAMES,
        CODE_LENGTH,
        MAX_ATTEMPTS,
        newGame,
        guess,
        getHint,
        isWin,
        isLoss,
      };
    })();
    </script>

      const E = MastermindEngine;
      const { COLORS, CODE_LENGTH, MAX_ATTEMPTS } = E;
      const i18n = window.JakhGameI18n;
      const t = (key, values) => i18n.t(key, values);
      const formatNumber = value => i18n.number(value);
      const colorName = index => t(`mmColor${index}`);

      // ── State ────────────────────────────────────────────
      let gameState = E.newGame();
      let selectedColor = 0;       // palette index
      let currentSlots = new Array(CODE_LENGTH).fill(null); // null = empty
      let hintPending = false;

      // ── DOM refs ─────────────────────────────────────────
      const board        = document.getElementById('mmBoard');
      const palette      = document.getElementById('palette');
      const colorNameEl  = document.getElementById('colorName');
      const submitBtn    = document.getElementById('submitBtn');
      const hintBtn      = document.getElementById('hintBtn');
      const hintStatus   = document.getElementById('hintStatus');
      const attemptCtr   = document.getElementById('attemptCounter');
      const resultBanner = document.getElementById('resultBanner');
      const resultIcon   = document.getElementById('resultIcon');
      const resultMsg    = document.getElementById('resultMsg');
      const resultSub    = document.getElementById('resultSub');
      const secretReveal = document.getElementById('secretReveal');
      const newGameBtn   = document.getElementById('newGameBtn');
      const paletteSection = document.getElementById('paletteSection');

      // ── Build palette ─────────────────────────────────────
      function buildPalette() {
        palette.innerHTML = '';
        COLORS.forEach((color, i) => {
          const swatch = document.createElement('button');
          swatch.className = 'mm-swatch' + (i === selectedColor ? ' selected' : '');
          swatch.style.background = color;
          swatch.setAttribute('aria-label', t('mmColorChoice', { color: colorName(i) }));
          swatch.setAttribute('title', colorName(i));
          swatch.addEventListener('click', () => selectColor(i));
          palette.appendChild(swatch);
        });
        colorNameEl.textContent = colorName(selectedColor);
      }

      function selectColor(i) {
        selectedColor = i;
        document.querySelectorAll('.mm-swatch').forEach((sw, idx) => {
          sw.classList.toggle('selected', idx === i);
        });
        colorNameEl.textContent = colorName(i);
      }

      // ── Build board ───────────────────────────────────────
      function buildBoard() {
        board.innerHTML = '';
        const totalRows = MAX_ATTEMPTS;

        for (let rowIdx = 0; rowIdx < totalRows; rowIdx++) {
          const attempt = gameState.attempts[rowIdx];
          const isActive = rowIdx === gameState.attempts.length && gameState.status === 'playing';
          const isPast = rowIdx < gameState.attempts.length;

          const row = document.createElement('div');
          row.className = 'mm-row' +
            (isActive ? ' active-row' : '') +
            (isPast ? ' past' : '');
          row.setAttribute('role', 'row');
          row.setAttribute('aria-label', t('mmRowAria', { row: formatNumber(rowIdx + 1) }));

          // Row number
          const numEl = document.createElement('span');
          numEl.className = 'mm-row-num';
          numEl.textContent = formatNumber(rowIdx + 1);
          row.appendChild(numEl);

          // Pegs container
          const pegsEl = document.createElement('div');
          pegsEl.className = 'mm-pegs';

          for (let slotIdx = 0; slotIdx < CODE_LENGTH; slotIdx++) {
            const peg = document.createElement('button');
            peg.className = 'mm-peg';
            peg.setAttribute('aria-label', t('mmSlotAria', { slot: formatNumber(slotIdx + 1) }));

            if (isPast && attempt) {
              const colorIdx = attempt.code[slotIdx];
              peg.style.background = COLORS[colorIdx];
              peg.classList.add('filled');
              peg.disabled = true;
              peg.setAttribute('aria-label', t('mmSlotColorAria', {
                slot: formatNumber(slotIdx + 1),
                color: colorName(colorIdx),
              }));
            } else if (isActive) {
              const colorIdx = currentSlots[slotIdx];
              if (colorIdx !== null) {
                peg.style.background = COLORS[colorIdx];
                peg.classList.add('filled');
                peg.setAttribute('aria-label', t('mmSlotColorAria', {
                  slot: formatNumber(slotIdx + 1),
                  color: colorName(colorIdx),
                }));
              }
              peg.addEventListener('click', () => fillSlot(slotIdx));
            } else {
              peg.disabled = true;
              peg.style.opacity = '0.35';
            }

            pegsEl.appendChild(peg);
          }
          row.appendChild(pegsEl);

          // Feedback pegs (2×2 grid)
          const feedbackEl = document.createElement('div');
          feedbackEl.className = 'mm-feedback';
          feedbackEl.setAttribute('aria-label', isPast && attempt
            ? t('mmFeedbackAria', {
                black: formatNumber(attempt.blacks),
                white: formatNumber(attempt.whites),
              })
            : '');

          // Order: blacks first, then whites, then empty
          const feedbackOrder = [];
          if (isPast && attempt) {
            for (let b = 0; b < attempt.blacks; b++) feedbackOrder.push('black');
            for (let w = 0; w < attempt.whites; w++) feedbackOrder.push('white');
          }
          while (feedbackOrder.length < CODE_LENGTH) feedbackOrder.push('empty');

          feedbackOrder.forEach(type => {
            const fp = document.createElement('div');
            fp.className = 'mm-fb-peg ' + type;
            feedbackEl.appendChild(fp);
          });
          row.appendChild(feedbackEl);

          board.appendChild(row);
        }
      }

      // ── Fill a slot in the current row ───────────────────
      function fillSlot(slotIdx) {
        if (gameState.status !== 'playing') return;
        currentSlots[slotIdx] = selectedColor;
        buildBoard();
        updateSubmitState();
      }

      // ── Submit guess ──────────────────────────────────────
      function submitGuess() {
        if (gameState.status !== 'playing') return;
        if (currentSlots.some(s => s === null)) return;

        gameState = E.guess(gameState, [...currentSlots]);
        currentSlots = new Array(CODE_LENGTH).fill(null);
        buildBoard();
        updateAttemptCounter();
        updateSubmitState();

        if (gameState.status === 'won') {
          showResult('win');
        } else if (gameState.status === 'lost') {
          showResult('loss');
        }
      }

      // ── Hint ──────────────────────────────────────────────
      function applyHint() {
        if (gameState.status !== 'playing') return;
        hintPending = true;
        renderHintStatus();
        hintBtn.disabled = true;

        // Use setTimeout to let the browser paint before heavy computation
        setTimeout(() => {
          const h = E.getHint(gameState);
          if (h) {
            currentSlots = [...h];
            buildBoard();
            updateSubmitState();
          }
          hintPending = false;
          renderHintStatus();
          hintBtn.disabled = false;
        }, 16);
      }

      // ── Result banner ─────────────────────────────────────
      function showResult(outcome) {
        const n = gameState.attempts.length;
        if (outcome === 'win') {
          resultIcon.textContent = '✅';
          resultMsg.textContent = t('mmWinAttempts', {
            count: formatNumber(n),
            rawCount: n,
          });
          resultSub.textContent = t('mmExcellent');
          secretReveal.innerHTML = '';
        } else {
          resultIcon.textContent = '💀';
          resultMsg.textContent = t('mmOutOfAttempts');
          resultSub.textContent = t('mmSecretWas');
          secretReveal.innerHTML = '';
          gameState.secret.forEach(colorIdx => {
            const peg = document.createElement('div');
            peg.className = 'mm-secret-peg';
            peg.style.background = COLORS[colorIdx];
            peg.setAttribute('title', colorName(colorIdx));
            peg.setAttribute('aria-label', t('mmColorChoice', { color: colorName(colorIdx) }));
            secretReveal.appendChild(peg);
          });
        }
        resultBanner.classList.add('visible');
        paletteSection.style.opacity = '0.45';
        paletteSection.style.pointerEvents = 'none';
        submitBtn.disabled = true;
        hintBtn.disabled = true;
      }

      // ── New game ──────────────────────────────────────────
      function startNewGame() {
        gameState = E.newGame();
        currentSlots = new Array(CODE_LENGTH).fill(null);
        selectedColor = 0;
        resultBanner.classList.remove('visible');
        paletteSection.style.opacity = '';
        paletteSection.style.pointerEvents = '';
        hintPending = false;
        buildPalette();
        buildBoard();
        updateAttemptCounter();
        updateSubmitState();
        renderHintStatus();
      }

      // ── UI state helpers ──────────────────────────────────
      function updateAttemptCounter() {
        const n = gameState.attempts.length;
        attemptCtr.textContent = t('mmCounter', {
          current: formatNumber(n),
          max: formatNumber(MAX_ATTEMPTS),
        });
      }

      function renderHintStatus() {
        hintStatus.textContent = hintPending ? t('mmComputing') : '';
      }

      function updateSubmitState() {
        const allFilled = currentSlots.every(s => s !== null);
        submitBtn.disabled = !allFilled || gameState.status !== 'playing';
      }

      // ── Event listeners ───────────────────────────────────
      submitBtn.addEventListener('click', submitGuess);
      hintBtn.addEventListener('click', applyHint);
      newGameBtn.addEventListener('click', startNewGame);

      i18n.onChange(() => {
        buildPalette();
        buildBoard();
        updateAttemptCounter();
        renderHintStatus();
        if (gameState.status === 'won') showResult('win');
        if (gameState.status === 'lost') showResult('loss');
      });

// ── Init ──────────────────────────────────────────────
      buildPalette();
      buildBoard();
      updateAttemptCounter();
      updateSubmitState();
    })();
    </script>

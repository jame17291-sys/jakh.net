# Nginx Production Configuration for jakh.net

server {
    listen 80;
    listen [::]:80;
    server_name jakh.net www.jakh.net;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jakh.net www.jakh.net;

    root /var/www/jakh.net/dist;
    index index.html;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/jakh.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jakh.net/privkey.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' wss://jakh.net ws://jakh.net;" always;

    # Compression Settings
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Brotli Compression (if ngx_brotli is enabled on server)
    # brotli on;
    # brotli_static on;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Immutable Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Service Worker & Manifest (No-cache so updates land immediately)
    location ~* \.(webmanifest|xml|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API Proxying & WebSockets
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Extended timeouts for WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Custom 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

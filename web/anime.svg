<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="320" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF416C"/>
      <stop offset="100%" stop-color="#FF4B2B"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="220" rx="20" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="270" cy="30" r="60" fill="white" fill-opacity="0.06"/>
  <circle cx="50" cy="190" r="50" fill="white" fill-opacity="0.06"/>
  <circle cx="160" cy="110" r="90" fill="white" fill-opacity="0.04"/>

  <!-- Ninja star (4-pointed) -->
  <g transform="translate(68,58) rotate(20)" opacity="0.9">
    <polygon points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" fill="white" fill-opacity="0.85"/>
  </g>

  <!-- Dragon Ball sphere -->
  <circle cx="180" cy="55" r="22" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="174" cy="49" r="7" fill="white" fill-opacity="0.5"/>
  <circle cx="185" cy="61" r="5" fill="white" fill-opacity="0.35"/>
  <circle cx="177" cy="62" r="3" fill="white" fill-opacity="0.35"/>

  <!-- Sword (Demon Slayer / SAO style) -->
  <g transform="translate(248,150) rotate(-35)">
    <rect x="-3" y="-60" width="6" height="100" rx="2" fill="white" fill-opacity="0.8"/>
    <rect x="-10" y="36" width="20" height="6" rx="2" fill="white" fill-opacity="0.6"/>
    <rect x="-4" y="40" width="8" height="16" rx="2" fill="white" fill-opacity="0.5"/>
    <polygon points="0,-70 -4,-55 4,-55" fill="white" fill-opacity="0.9"/>
  </g>

  <!-- Pokéball -->
  <g transform="translate(105,148)">
    <circle r="22" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="-22" y="-2" width="44" height="4" rx="1" fill="white" fill-opacity="0.45"/>
    <circle r="7" fill="white" fill-opacity="0.7"/>
    <circle r="4" fill="url(#bg)"/>
  </g>

  <!-- Death Note book outline -->
  <g transform="translate(205,150)">
    <rect x="-16" y="-22" width="32" height="44" rx="3" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="-10" y1="-12" x2="10" y2="-12" stroke="white" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="-10" y1="-5" x2="10" y2="-5" stroke="white" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="-10" y1="2" x2="10" y2="2" stroke="white" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="-10" y1="9" x2="6" y2="9" stroke="white" stroke-opacity="0.4" stroke-width="1.2"/>
  </g>

  <!-- Survey Corps wings of freedom (simplified) -->
  <g transform="translate(68,150)" opacity="0.75">
    <ellipse cx="-14" cy="0" rx="10" ry="18" fill="white" fill-opacity="0.6" transform="rotate(-15,-14,0)"/>
    <ellipse cx="-8" cy="-4" rx="6" ry="12" fill="white" fill-opacity="0.4" transform="rotate(-30,-8,-4)"/>
    <ellipse cx="14" cy="0" rx="10" ry="18" fill="white" fill-opacity="0.6" transform="rotate(15,14,0)"/>
    <ellipse cx="8" cy="-4" rx="6" ry="12" fill="white" fill-opacity="0.4" transform="rotate(30,8,-4)"/>
  </g>

  <!-- Sparkling stars -->
  <g fill="white" fill-opacity="0.55">
    <circle cx="140" cy="30" r="2"/>
    <circle cx="155" cy="20" r="1.5"/>
    <circle cx="168" cy="35" r="1.2"/>
    <circle cx="240" cy="100" r="1.8"/>
    <circle cx="255" cy="85" r="1.2"/>
    <circle cx="30" cy="100" r="1.5"/>
    <circle cx="42" cy="88" r="1"/>
  </g>

  <!-- Title text -->
  <text x="160" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="white" fill-opacity="0.9" text-anchor="middle" letter-spacing="1">ANIME UNIVERSE</text>
</svg>

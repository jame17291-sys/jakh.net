<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="ayt-bg" x1="0" y1="0" x2="320" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C3483"/>
      <stop offset="100%" stop-color="#1A5276"/>
    </linearGradient>
    <linearGradient id="ayt-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5DADE2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A569BD" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="220" rx="20" fill="url(#ayt-bg)"/>

  <!-- Decorative orbs -->
  <circle cx="280" cy="30" r="65" fill="white" fill-opacity="0.05"/>
  <circle cx="40" cy="195" r="55" fill="white" fill-opacity="0.05"/>
  <circle cx="160" cy="110" r="100" fill="white" fill-opacity="0.03"/>

  <!-- Vintage TV set -->
  <rect x="80" y="50" width="160" height="110" rx="12" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- TV screen -->
  <rect x="92" y="60" width="120" height="78" rx="8" fill="url(#ayt-screen)" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Screen scanlines -->
  <line x1="92" y1="72" x2="212" y2="72" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="92" y1="84" x2="212" y2="84" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="92" y1="96" x2="212" y2="96" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="92" y1="108" x2="212" y2="108" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="92" y1="120" x2="212" y2="120" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="92" y1="132" x2="212" y2="132" stroke="white" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Star on screen (Spacetoon rocket / star symbol) -->
  <polygon points="152,75 156,86 168,86 158,93 162,104 152,97 142,104 146,93 136,86 148,86"
           fill="white" fill-opacity="0.7"/>

  <!-- TV legs -->
  <rect x="110" y="160" width="14" height="16" rx="3" fill="white" fill-opacity="0.2"/>
  <rect x="196" y="160" width="14" height="16" rx="3" fill="white" fill-opacity="0.2"/>
  <!-- TV antenna -->
  <line x1="144" y1="50" x2="128" y2="28" stroke="white" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <line x1="176" y1="50" x2="192" y2="28" stroke="white" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="128" cy="27" r="3" fill="white" fill-opacity="0.6"/>
  <circle cx="192" cy="27" r="3" fill="white" fill-opacity="0.6"/>

  <!-- TV control knobs -->
  <circle cx="228" cy="85" r="6" fill="white" fill-opacity="0.25" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="228" cy="105" r="6" fill="white" fill-opacity="0.25" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="228" cy="125" r="5" fill="white" fill-opacity="0.2" stroke="white" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Sparkle stars -->
  <g fill="white" fill-opacity="0.5">
    <circle cx="45" cy="60" r="2"/>
    <circle cx="58" cy="48" r="1.5"/>
    <circle cx="35" cy="75" r="1.2"/>
    <circle cx="268" cy="150" r="2"/>
    <circle cx="280" cy="138" r="1.5"/>
    <circle cx="258" cy="162" r="1.2"/>
    <circle cx="60" cy="130" r="1.5"/>
    <circle cx="262" cy="75" r="1.8"/>
  </g>

  <!-- Title text -->
  <text x="160" y="200" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="white" fill-opacity="0.9" text-anchor="middle" letter-spacing="0.5">SPACETOON CLASSICS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c9bff"/>
      <stop offset="100%" style="stop-color:#18d7c0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8f6bff"/>
      <stop offset="100%" style="stop-color:#7c9bff"/>
    </linearGradient>
  </defs>

  <!-- Hexagon mark -->
  <polygon points="36,8 56,8 66,25 56,42 36,42 26,25" fill="none" stroke="url(#g1)" stroke-width="2.5"/>
  <!-- Inner ? -->
  <text x="46" y="31" font-family="Georgia, serif" font-size="22" font-weight="700" fill="url(#g1)" text-anchor="middle">?</text>
  <!-- Dot under ? -->
  <circle cx="46" cy="37" r="2" fill="url(#g1)"/>

  <!-- JAKH wordmark -->
  <text x="80" y="36" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="url(#g1)" letter-spacing="3">JAKH</text>

  <!-- Divider line -->
  <line x1="80" y1="44" x2="220" y2="44" stroke="url(#g2)" stroke-width="1" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="80" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#8f9bb3" letter-spacing="2">RIDDLES &amp; QUIZZES</text>

  <!-- Arabic subtitle -->
  <text x="240" y="58" font-family="Arial, sans-serif" font-size="11" fill="#8f9bb3" letter-spacing="1">ألغاز واختبارات</text>
</svg>

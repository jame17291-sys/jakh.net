  <style>
    /* scoped go styles */
    :root {
      --panel: rgba(28,22,38,.9);
      --panel-strong: rgba(28,22,38,.99);
      --accent: #E8613C;
      --gilt: #C9A227;
      --easy: #48d597;
      --text: #F0E8D8;
      --muted: rgba(240,232,216,.56);
      --radius: 16px;
      --radius-sm: 10px;
      --line-strong: rgba(246,239,224,.15);
      --danger: #ff7a8a;
    }

    #goSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      padding-top: 0.5rem;
      padding-bottom: 3rem;
    }

    .go-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
    }

    /* Board wrapper */
    .go-board-wrap {
      position: relative;
      width: min(420px, calc(100vw - 2rem));
      height: min(420px, calc(100vw - 2rem));
      background: #8B6914;
      border-radius: 6px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55), inset 0 0 0 4px rgba(0,0,0,0.35);
      flex-shrink: 0;
    }

    .go-grid-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .go-stones-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .go-hit-layer {
      position: absolute;
      inset: 0;
      cursor: crosshair;
    }

    /* Stones */
    .go-stone {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: transform 0.08s ease;
    }
    .go-stone.black {
      background: radial-gradient(circle at 35% 30%, #555 0%, #13101a 60%);
      box-shadow: 1px 2px 4px rgba(0,0,0,0.7);
    }
    .go-stone.white {
      background: radial-gradient(circle at 35% 30%, #fff 0%, #F0E8D8 60%);
      box-shadow: 1px 2px 4px rgba(0,0,0,0.45);
    }
    .go-stone .last-dot {
      position: absolute;
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: #E8613C;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
    }

    /* Hover ghost */
    .go-hover-stone {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.45;
      display: none;
    }
    .go-hover-stone.black { background: #13101a; }
    .go-hover-stone.white { background: #F0E8D8; }

    /* Star points (hoshi) */
    .go-star {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(0,0,0,0.75);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Panel */
    .go-panel {
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      min-width: 200px;
      max-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .go-status-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
    }
    .go-turn-indicator {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(240,232,216,0.3);
    }
    .go-turn-indicator.black { background: #13101a; }
    .go-turn-indicator.white { background: #F0E8D8; }

    .go-scores {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .go-score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .go-score-row strong {
      color: var(--text);
      font-size: 1rem;
    }
    .go-score-pill {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .go-score-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .go-score-dot.black { background: #13101a; border: 1px solid rgba(255,255,255,0.2); }
    .go-score-dot.white { background: #F0E8D8; border: 1px solid rgba(0,0,0,0.2); }

    .go-btn-row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .go-btn {
      padding: 0.6rem 1rem;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    .go-btn:active { transform: scale(0.97); }
    .go-btn.primary { background: var(--accent); color: #fff; }
    .go-btn.secondary { background: var(--line-strong); color: var(--text); border: 1px solid var(--line-strong); }
    .go-btn.hint-btn { background: rgba(200,162,39,0.18); color: var(--gilt); border: 1px solid rgba(200,162,39,0.3); }
    .go-btn:disabled { opacity: 0.38; cursor: not-allowed; }

    .go-message {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.88rem;
      color: var(--muted);
      min-height: 1.2em;
      text-align: center;
    }
    .go-message.highlight { color: var(--easy); font-weight: 600; }

    .go-result-banner {
      background: var(--panel-strong);
      border: 1px solid var(--gilt);
      border-radius: var(--radius);
      padding: 1.25rem 1.75rem;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      font-family: 'Instrument Sans', sans-serif;
    }
    .go-result-banner.visible { display: flex; }
    .go-result-banner h2 { color: var(--gilt); margin: 0; font-size: 1.4rem; }
    .go-result-banner p { color: var(--text); margin: 0; }

    @media (max-width: 520px) {
      .go-panel { max-width: 100%; min-width: unset; width: min(420px, calc(100vw - 2rem)); }
      .go-layout { flex-direction: column; align-items: center; }
    }
  </style>

  <!-- GO ENGINE — Pure logic, zero DOM                           -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <script id="go-engine">
  var GoEngine = (function() {
    'use strict';

    var SIZE = 9;

    function emptyBoard() {
      var b = [];
      for (var r = 0; r < SIZE; r++) {
        b[r] = [];
        for (var c = 0; c < SIZE; c++) b[r][c] = null;
      }
      return b;
    }

    function cloneBoard(board) {
      return board.map(function(row) { return row.slice(); });
    }

    function cloneState(state) {
      return {
        board: cloneBoard(state.board),
        turn: state.turn,
        captured: { b: state.captured.b, w: state.captured.w },
        passes: state.passes,
        history: state.history.slice()
      };
    }

    function newGame() {
      return {
        board: emptyBoard(),
        turn: 'b',
        captured: { b: 0, w: 0 },
        passes: 0,
        history: []
      };
    }

    function neighbors(r, c) {
      var ns = [];
      if (r > 0)        ns.push([r-1, c]);
      if (r < SIZE-1)   ns.push([r+1, c]);
      if (c > 0)        ns.push([r, c-1]);
      if (c < SIZE-1)   ns.push([r, c+1]);
      return ns;
    }

    // Flood-fill group from (r,c) for given color; returns {stones:[[r,c]...], liberties:count}
    function getGroup(board, r, c) {
      var color = board[r][c];
      if (!color) return null;
      var visited = {};
      var stones = [];
      var libertySet = {};
      var queue = [[r, c]];
      visited[r + ',' + c] = true;
      while (queue.length) {
        var cur = queue.shift();
        stones.push(cur);
        var ns = neighbors(cur[0], cur[1]);
        for (var i = 0; i < ns.length; i++) {
          var nr = ns[i][0], nc = ns[i][1];
          var key = nr + ',' + nc;
          if (board[nr][nc] === null) {
            libertySet[key] = true;
          } else if (board[nr][nc] === color && !visited[key]) {
            visited[key] = true;
            queue.push([nr, nc]);
          }
        }
      }
      return { stones: stones, liberties: Object.keys(libertySet).length };
    }

    // Remove group from board, return count removed
    function removeGroup(board, stones) {
      for (var i = 0; i < stones.length; i++) {
        board[stones[i][0]][stones[i][1]] = null;
      }
      return stones.length;
    }

    // Try placing color at (r,c) on a copy of board.
    // Returns {ok:bool, board:newBoard, captured:int}
    function tryPlace(board, r, c, color) {
      if (board[r][c] !== null) return { ok: false };
      var nb = cloneBoard(board);
      nb[r][c] = color;
      var opp = color === 'b' ? 'w' : 'b';
      var totalCaptured = 0;
      // Capture opponent groups with 0 liberties
      var ns = neighbors(r, c);
      for (var i = 0; i < ns.length; i++) {
        var nr = ns[i][0], nc = ns[i][1];
        if (nb[nr][nc] === opp) {
          var g = getGroup(nb, nr, nc);
          if (g && g.liberties === 0) {
            totalCaptured += removeGroup(nb, g.stones);
          }
        }
      }
      // Check suicide: own group must have liberties
      var ownGroup = getGroup(nb, r, c);
      if (ownGroup.liberties === 0) return { ok: false };
      return { ok: true, board: nb, captured: totalCaptured };
    }

    function getLegalMoves(state, color) {
      var moves = [];
      if (getStatus(state) === 'ended') return moves;
      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          if (state.board[r][c] === null) {
            var result = tryPlace(state.board, r, c, color);
            if (result.ok) moves.push({ row: r, col: c });
          }
        }
      }
      return moves;
    }

    function applyMove(state, row, col) {
      var color = state.turn;
      var result = tryPlace(state.board, row, col, color);
      if (!result.ok) return state; // illegal
      var ns = cloneState(state);
      ns.board = result.board;
      var opp = color === 'b' ? 'w' : 'b';
      ns.captured[color] += result.captured;
      ns.passes = 0;
      ns.turn = opp;
      ns.history.push({ type: 'move', row: row, col: col, color: color });
      return ns;
    }

    function pass(state) {
      var ns = cloneState(state);
      ns.passes += 1;
      ns.turn = state.turn === 'b' ? 'w' : 'b';
      ns.history.push({ type: 'pass', color: state.turn });
      return ns;
    }

    function getStatus(state) {
      return state.passes >= 2 ? 'ended' : 'playing';
    }

    // Simple flood-fill territory scoring
    // An empty region belongs to a color if all adjacent stones are that color
    function score(state) {
      var board = state.board;
      var visited = {};
      var blackTerritory = 0, whiteTerritory = 0;

      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          if (board[r][c] === null && !visited[r + ',' + c]) {
            // Flood-fill empty region
            var region = [];
            var queue = [[r, c]];
            var borderColors = {};
            visited[r + ',' + c] = true;
            while (queue.length) {
              var cur = queue.shift();
              region.push(cur);
              var ns = neighbors(cur[0], cur[1]);
              for (var i = 0; i < ns.length; i++) {
                var nr = ns[i][0], nc = ns[i][1];
                var key = nr + ',' + nc;
                if (board[nr][nc] === null && !visited[key]) {
                  visited[key] = true;
                  queue.push([nr, nc]);
                } else if (board[nr][nc] !== null) {
                  borderColors[board[nr][nc]] = true;
                }
              }
            }
            var colors = Object.keys(borderColors);
            if (colors.length === 1) {
              if (colors[0] === 'b') blackTerritory += region.length;
              else whiteTerritory += region.length;
            }
          }
        }
      }

      return {
        black: blackTerritory + state.captured.b,
        white: whiteTerritory + state.captured.w + 6.5 // komi
      };
    }

    function getHint(state) {
      var color = state.turn;
      var legal = getLegalMoves(state, color);
      if (legal.length === 0) return null;
      var opp = color === 'b' ? 'w' : 'b';

      // Prefer capturing moves
      var capturing = legal.filter(function(m) {
        var result = tryPlace(state.board, m.row, m.col, color);
        return result.ok && result.captured > 0;
      });
      if (capturing.length > 0) {
        return capturing[Math.floor(Math.random() * capturing.length)];
      }

      // Prefer moves that expand groups (have neighbors of own color)
      var expanding = legal.filter(function(m) {
        var ns = neighbors(m.row, m.col);
        return ns.some(function(n) { return state.board[n[0]][n[1]] === color; });
      });
      if (expanding.length > 0) {
        return expanding[Math.floor(Math.random() * expanding.length)];
      }

      return legal[Math.floor(Math.random() * legal.length)];
    }

    return { newGame, getLegalMoves, applyMove, pass, getStatus, score, getHint };
  })();
  </script>

  <script id="go-ui">
  (function() {
    'use strict';

    var SIZE = 9;
    var STAR_POINTS = [
      [2,2],[2,4],[2,6],
      [4,2],[4,4],[4,6],
      [6,2],[6,4],[6,6]
    ];

    var boardEl      = document.getElementById('goBoard');
    var gridSvg      = document.getElementById('goGridSvg');
    var stonesLayer  = document.getElementById('goStonesLayer');
    var hitCanvas    = document.getElementById('goHitLayer');
    var hoverStone   = document.getElementById('goHoverStone');
    var turnDot      = document.getElementById('goTurnDot');
    var turnLabel    = document.getElementById('goTurnLabel');
    var scoreBlack   = document.getElementById('goScoreBlack');
    var scoreWhite   = document.getElementById('goScoreWhite');
    var capturesLbl  = document.getElementById('goCapturesLabel');
    var messageEl    = document.getElementById('goMessage');
    var passBtn      = document.getElementById('goPassBtn');
    var hintBtn      = document.getElementById('goHintBtn');
    var newBtn       = document.getElementById('goNewBtn');
    var resultBanner = document.getElementById('goResultBanner');
    var resultTitle  = document.getElementById('goResultTitle');
    var resultDesc   = document.getElementById('goResultDesc');
    var playAgainBtn = document.getElementById('goPlayAgainBtn');

    var state = GoEngine.newGame();
    var hintCell = null;

    // Board geometry
    function getBoardSize() {
      return boardEl.offsetWidth;
    }

    function getPadding() {
      return Math.round(getBoardSize() * 0.065);
    }

    function cellSize() {
      var pad = getPadding();
      return (getBoardSize() - pad * 2) / (SIZE - 1);
    }

    function intersectionXY(row, col) {
      var pad = getPadding();
      var cs = cellSize();
      return {
        x: pad + col * cs,
        y: pad + row * cs
      };
    }

    function stoneRadius() {
      return Math.round(cellSize() * 0.46);
    }

    // ── Draw grid ─────────────────────────────────────────────
    function drawGrid() {
      var pad = getPadding();
      var cs = cellSize();
      var bSize = getBoardSize();
      gridSvg.innerHTML = '';
      gridSvg.setAttribute('viewBox', '0 0 ' + bSize + ' ' + bSize);

      // Lines
      for (var i = 0; i < SIZE; i++) {
        var x = pad + i * cs;
        var y = pad + i * cs;
        // Vertical
        var vl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        vl.setAttribute('x1', x); vl.setAttribute('y1', pad);
        vl.setAttribute('x2', x); vl.setAttribute('y2', bSize - pad);
        vl.setAttribute('stroke', 'rgba(0,0,0,0.7)'); vl.setAttribute('stroke-width', '1');
        gridSvg.appendChild(vl);
        // Horizontal
        var hl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        hl.setAttribute('x1', pad); hl.setAttribute('y1', y);
        hl.setAttribute('x2', bSize - pad); hl.setAttribute('y2', y);
        hl.setAttribute('stroke', 'rgba(0,0,0,0.7)'); hl.setAttribute('stroke-width', '1');
        gridSvg.appendChild(hl);
      }

      // Star points
      for (var s = 0; s < STAR_POINTS.length; s++) {
        var sr = STAR_POINTS[s][0], sc = STAR_POINTS[s][1];
        var pos = intersectionXY(sr, sc);
        var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', pos.x); circle.setAttribute('cy', pos.y);
        circle.setAttribute('r', '3.5');
        circle.setAttribute('fill', 'rgba(0,0,0,0.75)');
        gridSvg.appendChild(circle);
      }
    }

    // ── Draw stones ───────────────────────────────────────────
    function drawStones() {
      stonesLayer.innerHTML = '';
      var board = state.board;
      var r = stoneRadius();
      var lastMove = null;
      for (var h = state.history.length - 1; h >= 0; h--) {
        if (state.history[h].type === 'move') { lastMove = state.history[h]; break; }
      }

      // Hint highlight
      if (hintCell) {
        var hpos = intersectionXY(hintCell.row, hintCell.col);
        var hd = document.createElement('div');
        hd.style.cssText = 'position:absolute;width:' + (r*2) + 'px;height:' + (r*2) + 'px;'
          + 'border-radius:50%;left:' + hpos.x + 'px;top:' + hpos.y + 'px;'
          + 'transform:translate(-50%,-50%);background:rgba(232,97,60,0.35);'
          + 'border:2px solid rgba(232,97,60,0.7);pointer-events:none;';
        stonesLayer.appendChild(hd);
      }

      for (var row = 0; row < SIZE; row++) {
        for (var col = 0; col < SIZE; col++) {
          if (board[row][col]) {
            var pos = intersectionXY(row, col);
            var el = document.createElement('div');
            el.className = 'go-stone ' + (board[row][col] === 'b' ? 'black' : 'white');
            el.style.cssText = 'width:' + (r*2) + 'px;height:' + (r*2) + 'px;'
              + 'left:' + pos.x + 'px;top:' + pos.y + 'px;';
            if (lastMove && lastMove.row === row && lastMove.col === col) {
              var dot = document.createElement('div');
              dot.className = 'last-dot';
              el.appendChild(dot);
            }
            stonesLayer.appendChild(el);
          }
        }
      }
    }

    // ── Update panel UI ───────────────────────────────────────
    function updatePanel() {
      var sc = GoEngine.score(state);
      scoreBlack.textContent = Math.round(sc.black);
      scoreWhite.textContent = sc.white.toFixed(1);
      capturesLbl.textContent = state.captured.b + ' / ' + state.captured.w;

      var ended = GoEngine.getStatus(state) === 'ended';
      if (!ended) {
        var color = state.turn;
        turnDot.className = 'go-turn-indicator ' + (color === 'b' ? 'black' : 'white');
        turnLabel.textContent = (color === 'b' ? 'Black' : 'White') + "'s turn";
        passBtn.disabled = false;
        hintBtn.disabled = false;
      } else {
        passBtn.disabled = true;
        hintBtn.disabled = true;
        showResult(sc);
      }
    }

    function showResult(sc) {
      resultBanner.classList.add('visible');
      var winner = sc.black > sc.white ? 'Black' : 'White';
      resultTitle.textContent = winner + ' wins!';
      resultDesc.textContent = 'Final score — Black: ' + Math.round(sc.black)
        + ' · White: ' + sc.white.toFixed(1) + ' (includes 6.5 komi)';
    }

    function setMessage(msg, highlight) {
      messageEl.textContent = msg;
      messageEl.className = 'go-message' + (highlight ? ' highlight' : '');
    }

    // ── Hit testing ───────────────────────────────────────────
    function nearestIntersection(canvasX, canvasY) {
      var pad = getPadding();
      var cs = cellSize();
      var col = Math.round((canvasX - pad) / cs);
      var row = Math.round((canvasY - pad) / cs);
      col = Math.max(0, Math.min(SIZE - 1, col));
      row = Math.max(0, Math.min(SIZE - 1, row));
      // Check if close enough (within half a cell)
      var pos = intersectionXY(row, col);
      var dx = canvasX - pos.x, dy = canvasY - pos.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < cs * 0.6) return { row, col };
      return null;
    }

    function getCanvasXY(evt) {
      var rect = hitCanvas.getBoundingClientRect();
      var scaleX = hitCanvas.width / rect.width;
      var scaleY = hitCanvas.height / rect.height;
      var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      var clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function resizeCanvas() {
      var sz = getBoardSize();
      hitCanvas.width = sz;
      hitCanvas.height = sz;
    }

    // ── Hover ─────────────────────────────────────────────────
    hitCanvas.addEventListener('mousemove', function(e) {
      if (GoEngine.getStatus(state) === 'ended') { hoverStone.style.display = 'none'; return; }
      var xy = getCanvasXY(e);
      var cell = nearestIntersection(xy.x, xy.y);
      if (!cell || state.board[cell.row][cell.col] !== null) {
        hoverStone.style.display = 'none'; return;
      }
      var r = stoneRadius();
      var pos = intersectionXY(cell.row, cell.col);
      hoverStone.className = 'go-hover-stone ' + (state.turn === 'b' ? 'black' : 'white');
      hoverStone.style.cssText = 'display:block;width:' + (r*2) + 'px;height:' + (r*2) + 'px;'
        + 'left:' + pos.x + 'px;top:' + pos.y + 'px;border-radius:50%;'
        + 'transform:translate(-50%,-50%);pointer-events:none;opacity:0.45;'
        + (state.turn === 'b' ? 'background:#13101a;' : 'background:#F0E8D8;');
    });

    hitCanvas.addEventListener('mouseleave', function() {
      hoverStone.style.display = 'none';
    });

    // ── Click to place ────────────────────────────────────────
    function placeAt(row, col) {
      if (GoEngine.getStatus(state) === 'ended') return;
      if (state.board[row][col] !== null) {
        setMessage('Intersection occupied');
        return;
      }
      var newState = GoEngine.applyMove(state, row, col);
      if (newState === state) {
        setMessage('Illegal move (suicide)');
        return;
      }
      hintCell = null;
      state = newState;
      render();
      setMessage('');
    }

    hitCanvas.addEventListener('click', function(e) {
      var xy = getCanvasXY(e);
      var cell = nearestIntersection(xy.x, xy.y);
      if (cell) placeAt(cell.row, cell.col);
    });

    hitCanvas.addEventListener('touchend', function(e) {
      e.preventDefault();
      var xy = getCanvasXY(e.changedTouches ? { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY } : e);
      var cell = nearestIntersection(xy.x, xy.y);
      if (cell) placeAt(cell.row, cell.col);
    }, { passive: false });

    // ── Buttons ───────────────────────────────────────────────
    passBtn.addEventListener('click', function() {
      if (GoEngine.getStatus(state) === 'ended') return;
      state = GoEngine.pass(state);
      hintCell = null;
      render();
      if (GoEngine.getStatus(state) !== 'ended') setMessage('Passed — ' + (state.turn === 'b' ? 'Black' : 'White') + "'s turn");
    });

    hintBtn.addEventListener('click', function() {
      if (GoEngine.getStatus(state) === 'ended') return;
      var hint = GoEngine.getHint(state);
      if (hint) {
        hintCell = hint;
        render();
        setMessage('Hint: row ' + (hint.row + 1) + ', col ' + (hint.col + 1), true);
      } else {
        setMessage('No moves available — consider passing', true);
      }
    });

    newBtn.addEventListener('click', startNew);
    playAgainBtn.addEventListener('click', startNew);

    function startNew() {
      state = GoEngine.newGame();
      hintCell = null;
      resultBanner.classList.remove('visible');
      render();
      setMessage('Black goes first');
    }

    // ── Main render ───────────────────────────────────────────
    function render() {
      resizeCanvas();
      drawGrid();
      drawStones();
      updatePanel();
    }

    // ── Responsive resize ─────────────────────────────────────
    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 80);
    });

    // ── Init ──────────────────────────────────────────────────
    render();
    setMessage('Black goes first');

  })();
  </script>
</body>
</html>
